# Site tekoia na Netlify: export estático do Next (sem functions, sem edge, sem adapter).
#
# Monorepo: este arquivo fica no package directory (apps/web) e o base directory é a raiz do
# repositório; por isso todos os caminhos abaixo são relativos à raiz.
#
# Os deploys saem do GitHub Actions (`netlify deploy --build --context <ctx>`); no painel, os
# builds ficam parados (Build status: Stopped) e os deploy previews desligados.

[build]
  command = "corepack pnpm --filter @teko/web build"
  publish = "apps/web/out"

[build.environment]
  # O export estático é publicado como está: o @netlify/plugin-nextjs roda só para se desligar.
  NETLIFY_NEXT_PLUGIN_SKIP = "true"
  NEXT_TELEMETRY_DISABLED = "1"

# Sem esta declaração, a Netlify instala o @netlify/plugin-nextjs sozinha, do npm e sem versão
# fixa, ao detectar o Next (spike F1 (a)). Declarado aqui e como devDependency do @teko/web, ela usa
# a cópia do lockfile, sob a política de supply chain; o NETLIFY_NEXT_PLUGIN_SKIP acima desliga a
# lógica dele.
[[plugins]]
  package = "@netlify/plugin-nextjs"

# Proxy assinado /api/* → API do contexto (só configuração; ver o plugin).
[[plugins]]
  package = "/apps/web/netlify/plugins/context-routing"

[context.production.environment]
  NEXT_PUBLIC_STREAM_ORIGIN = "https://teko-api.vercel.app"

[context.develop.environment]
  NEXT_PUBLIC_STREAM_ORIGIN = "https://teko-api-staging.vercel.app"

# Headers globais (netlify.toml não aceita escopo por contexto). O CSP completo, com os hashes
# dos <script>/<style> inline, é gerado por caminho em out/_headers no pós-build; o CSP daqui só
# traz diretivas que não dependem do HTML e é compatível com ele (os dois são aplicados).
[[headers]]
  for = "/*"
  [headers.values]
    Strict-Transport-Security = "max-age=63072000; includeSubDomains"
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), browsing-topics=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Content-Security-Policy = "object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'"

[[headers]]
  for = "/_next/static/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
