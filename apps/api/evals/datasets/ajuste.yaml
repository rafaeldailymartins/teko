    status: answered
    reference_date: "2023-08-01"
    provisions: ["go:rcte:art:20:inc:I"]
    validity: { from: "1998-01-01", to: "2024-04-01" }
    facts: ["17% (dezessete por cento)"]
  pair: hold-rcte-aliquota-interna
  tags: [rcte-cte, rcte, vigencia, fora-da-fixture, ex-holdout]
  source_url: https://appasp.economia.go.gov.br/Legislacao/arquivos/Rcte/RCTE.htm
  source_quote: I - 17% (dezessete por cento), na operação e prestação internas, observado o disposto no § 1º;
  curated_by: claude-opus-5.5 (curadoria assistida por LLM; revisada pelo mantenedor)
  reviewed_at: "2026-11-13"

