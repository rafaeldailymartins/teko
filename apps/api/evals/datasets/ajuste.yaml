# Conjunto ajuste do golden do Tekó (ADR 0031, adendo de 2026-11-14). Schema em datasets/schema.ts.
#
# Os 13 casos do holdout que orientaram os ajustes da busca na F4 (a revisão de
# docs/evals/revisao-holdout-2026-11-13.md e as rodadas de docs/evals/mrr-f4-2026-11-14.md). Pela
# ADR 0031, um caso do holdout que orientou ajuste sai do holdout; o holdout recebeu 13 casos novos.
#
# Regras do ajuste:
# - pode orientar parâmetros, como o dev;
# - roda só no corpus-eval, contra o corpus real do staging: quase todos os dispositivos estão fora
#   da fixture, e as perguntas não têm vetor nela;
# - gate próprio (retrieval-ajuste): vigência e data de referência travadas em 1,00 (só há casos
#   com resposta); recall@10 e MRR informativos, para não baixar os gates do dev.
#
# Os casos vieram do holdout sem mudança no esperado (id com ajuste- no lugar de hold- e a tag
# ex-holdout); revisados pelo mantenedor em 2026-11-13.

