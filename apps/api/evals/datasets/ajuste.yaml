- id: ajuste-rcte-difal-uso-consumo
  question: Comprei material de uso e consumo de fornecedor de outro estado. Como fica o ICMS devido a Goiás nessa entrada?
  periodo_apuracao: "2024-09"
  reference_source: periodo_apuracao
  locale: pt-BR
  families: [rcte]
  # revisão independente (LLM) 2026-11-13, DÚVIDA decidida pelo mantenedor em 2026-11-13 (opção B):
  # a pergunta é ampla ("como fica o ICMS"), e a resposta completa cita a incidência (art. 4º, § 1º,
  # II), a alíquota do diferencial (art. 20, § 1º, IV, "a"), a base de cálculo (art. 12, IV) e o
  # cálculo (art. 65, III). A pergunta não muda; o esperado ganha os três dispositivos.
  expected:
    status: answered
    reference_date: "2024-09-01"
    provisions:
      - "go:rcte:art:20:par:1:inc:IV"
      - "go:rcte:art:20:par:1:inc:IV:ali:a"
      - "go:rcte:art:4:par:1:inc:II"
      - "go:rcte:art:12:inc:IV"
      - "go:rcte:art:65:inc:III"
    validity: { from: "1998-01-01", to: null }
    facts:
      - "diferença entre a alíquota interna utilizada neste Estado e a interestadual"
      - "valor da operação no Estado de Goiás, acrescido do valor do Imposto sobre Produtos Industrializados"
  tags: [rcte-cte, rcte, varios-dispositivos, linguagem-de-contador, fora-da-fixture, ex-holdout]
  source_url: https://appasp.economia.go.gov.br/Legislacao/arquivos/Rcte/RCTE.htm
  source_quote: relativamente ao diferencial de alíquotas devido pela aquisição de bens ou mercadorias para uso, consumo final ou integração ao ativo imobilizado, o contribuinte deve calcular o montante do imposto devido em cada operação ou prestação
  curated_by: claude-opus-5.5 (curadoria assistida por LLM; revisada pelo mantenedor)
  reviewed_at: "2026-11-13"

