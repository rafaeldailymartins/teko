- id: ajuste-efdgo-retificacao-sem-autorizacao
  question: Até quando posso corrigir a EFD já entregue em Goiás sem precisar de autorização da Secretaria da Economia?
  periodo_apuracao: "2026-04"
  reference_source: periodo_apuracao
  locale: pt-BR
  families: [efd-go, rcte]
  # revisão independente (LLM) 2026-11-13: o esperado parava no inciso I, mas desde 11/11/2022
  # (Decreto nº 10.164/22) o inciso II do art. 356-O dispensa a autorização também depois desse
  # prazo, quando houver prova inequívoca de erro de fato; o item 7 do Guia de Goiás registra a
  # mesma dispensa. Entrou o inciso II (chave conferida no parser), o fato correspondente e a citação
  # nova. Ressalvas que a resposta gerada deve trazer: § 1º-A (PROTEGE) e § 5º do mesmo artigo.
  expected:
    status: answered
    reference_date: "2026-04-01"
    provisions: ["go:efd-go:item:7", "go:rcte:art:356-O:inc:I", "go:rcte:art:356-O:inc:II"]
    facts:
      - "até o último dia do terceiro mês subsequente ao encerramento do mês da apuração"
      - "após o prazo de que trata o inciso I, independentemente de autorização da administração tributária"
  tags: [efd-go, rcte, varios-dispositivos, linguagem-de-contador, fora-da-fixture, ex-holdout]
  source_url: https://appasp.economia.go.gov.br/Legislacao/arquivos/Rcte/RCTE.htm
  source_quote: II - após o prazo de que trata o inciso I, independentemente de autorização da administração tributária, no caso em que houver prova inequívoca da ocorrência de erro de fato no preenchimento da escrituração e evidenciada a impossibilidade ou a inconveniência de saneá-la por meio de lançamento corretivo.
  curated_by: claude-opus-5.5 (curadoria assistida por LLM; revisada pelo mantenedor)
  reviewed_at: "2026-11-13"

