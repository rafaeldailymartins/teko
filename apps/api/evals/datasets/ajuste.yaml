- id: ajuste-rcte-etanol-en
  question: What ICMS rate applies to intrastate sales of ethanol fuel in Goiás?
  periodo_apuracao: "2024-06"
  reference_source: periodo_apuracao
  locale: en
  families: [rcte]
  # revisão independente (LLM) 2026-11-13: o esperado dizia 23%, mas a NOTA do próprio inciso
  # VIII no RCTE tira o efeito dessa redação desde 23/06/2022 (LC 194/2022) e manda aplicar 14,17%
  # desde 15/07/2022 (EC 123/2022, art. 4º). O parser não lê a nota "sem efeitos a partir de" e
  # grava o 23% como vigente ([2018-01-01, null) no staging); por isso a vigência esperada saiu do
  # caso até o mantenedor decidir como o parser trata essa nota. Dispositivo esperado mantido.
  expected:
    status: answered
    reference_date: "2024-06-01"
    provisions: ["go:rcte:art:20:par:1:inc:VIII"]
    facts: ["14,17% (quatorze inteiros e dezessete décimos por cento)"]
  tags: [rcte-cte, rcte, en, fora-da-fixture, ex-holdout]
  source_url: https://appasp.economia.go.gov.br/Legislacao/arquivos/Rcte/RCTE.htm
  source_quote: NOTA:Redação do inciso VIII sem efeitos a partir de 23 de junho de 2022 em função da Lei Complementar Federal nº 194, de 2022, sendo que, a partir de 15 de julho de 2022, é aplicada a alíquota de 14,17% (quatorze inteiros e dezessete décimos por cento) em função do disposto no art. 4º da Emenda Constitucional nº 123, de 14 de julho de 2022.
  curated_by: claude-opus-5.5 (curadoria assistida por LLM; revisada pelo mantenedor)
  reviewed_at: "2026-11-13"

