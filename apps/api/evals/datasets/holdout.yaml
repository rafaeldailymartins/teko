# Conjunto holdout do golden do Tekó (ADR 0031). Schema em datasets/schema.ts.
#
# Regras do holdout:
# - nunca orienta parâmetros (número de candidatos, pesos, limites, prompts): o ajuste é feito no
#   conjunto dev (golden.yaml); o holdout só mede, e decide a meta de MRR da F4;
# - roda só no corpus-eval (ingest.yml), contra o corpus real do staging: as perguntas não têm
#   vetor na fixture do PR;
# - mudar o esperado de um caso exige source_quote novo, conferido no texto da fonte; um caso que
#   reprova não é reescrito para passar.
#
# Grupos (primeira tag): rcte-cte 14, efd-icms-ipi 8, efd-go 5, tabelas-go 7, efd-reinf 8,
# recusa 5, sem-resposta 4, ambiguo 2 (53 casos, 10 em inglês, 10 com mais de um dispositivo
# esperado). Datas resolvidas com o relógio fixo de 2026-11-10 (America/Sao_Paulo).
#
# Curadoria assistida por LLM em 2026-11-12, pendente de revisão do mantenedor (reviewed_at nulo).
# Perguntas escritas sem copiar o texto do dispositivo. As chaves, vigências e source_quote saem dos
# parsers da ingestão rodados localmente sobre as fontes públicas de corpus/sources.yaml (RCTE e CTE
# consolidados até o Decreto nº 10.986/26 e a Lei nº 24.608/26, Tabelas de Goiás 5.1.1 v151, 5.2
# v51 e 5.3 v47, pacotes de XSD da EFD-Reinf 2.1.2) e, para a EFD ICMS/IPI e a EFD de Goiás, dos
# textos da fixture test/fixtures/corpus. Vigência (validity) só onde há uma única fonte por
# documento (RCTE, CTE e Tabelas): nos Guias e na REINF o staging tem várias versões e a vigência
# esperada dependeria da reconciliação.

# ---------------------------------------------------------------------------------------------
# RCTE e CTE (14): dispositivos fora do recorte da fixture (arts. 44 a 87 do RCTE e 44 em diante do
# CTE), com redações que mudam no tempo

