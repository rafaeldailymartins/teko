# Projeto pnpm ISOLADO para o Netlify CLI, com lockfile próprio (mesmo modelo de tools/vercel-cli).
#
# Por quê: o CLI só roda nos jobs de deploy do GitHub Actions, com o NETLIFY_AUTH_TOKEN, e traz
# uma árvore grande que não tem nada a ver com o runtime da aplicação. Isolado, ele não pesa no
# lockfile da raiz, e qualquer exceção de política fica confinada aqui. Ver
# docs/adr/0002-supply-chain-pnpm.md.
packages: []

minimumReleaseAge: 10080
trustPolicy: no-downgrade
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
pmOnFail: ignore

trustPolicyExclude:
  # Teve proveniência SLSA só em 2023 (1.3.0 a 1.5.2); nenhuma versão desde então tem proveniência
  # nem trusted publisher (conferido no registro em 2026-11-11). É um estado antigo do pacote, não
  # uma troca recente de publicador. Versão exata; revisar a cada atualização do CLI.
  # As duas versões vêm de dependentes diferentes (@netlify/server-dev e o pin exato de
  # @netlify/zip-it-and-ship-it 16.6.0).
  - "@netlify/serverless-functions-api@2.24.0"
  - "@netlify/serverless-functions-api@2.28.1"

allowBuilds:
  # Binário pré-compilado chega como optionalDependency; o script só valida/recompila.
  esbuild: false
  # postinstall do próprio CLI: só instala autocomplete no shell do usuário e imprime um banner.
  netlify-cli: false
  # Addon nativa opcional do hot-shots (statsd por socket Unix), carregada sob demanda; o deploy
  # não usa esse transporte.
  unix-dgram: false

# Correções de vulnerabilidades transitivas, como em tools/vercel-cli (cruzam major; o deploy do
# spike F1 (a) valida o CLI com elas). O CI audita este lockfile e falha com qualquer achado.
overrides:
  # GHSA-3g3m-2fjr-6pw4 (moderate). Via @fastify/static e @vercel/nft (glob 13.0.6).
  glob@>=9.0.0 <=14.0.1: ^14.0.2
  # GHSA-g3hv-75wg-m249 (moderate). Via glob (minimatch 10.2.6).
  minimatch@>=7.0.0 <11.0.1: ^11.0.1
  # Fora da árvore por licença (o dependency-review reprova): os dois só servem ao `netlify dev`,
  # que não roda aqui. sharp (libvips, LGPL-3.0) vem de ipx ← @netlify/images (CDN de imagens
  # local), como o next>sharp removido na raiz; @netlify/redirect-matcher (UNLICENSED) vem de
  # @netlify/redirects ← @netlify/dev. O deploy do spike F1 (a) valida o CLI sem eles.
  sharp: "-"
  "@netlify/redirect-matcher": "-"

auditConfig:
  ignoreGhsas:
    # deepmerge 4.3.1 (low, prototype poisoning no objeto devolvido): não há versão corrigida. Só o
    # @netlify/config o usa, para mesclar a configuração do netlify.toml do próprio repositório
    # com a do site; nenhuma entrada externa chega ali. Remover quando sair versão corrigida.
    - GHSA-gcqx-w48m-w2h4
