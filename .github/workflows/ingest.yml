# Ingestão do corpus no staging (plano: "Ingestão, vigência e avaliação"; mudanças OpenSpec
# add-embedding-pipeline e add-docling-pdf-extraction).
#
#   discover (staging) → docling-models → extract (matriz, sem segredos) → load (staging)
#     → corpus-eval (staging) → lock-pr (App teko-release-bot) → summary
#
# Modo `eval-only` (dispatch, ADR 0031): pula discover, extract e load e roda só o corpus-eval
# contra o estado atual do staging. Com `ref` (SHA de um PR do próprio repositório, disparado pelo
# rótulo `corpus-eval`, corpus-eval-label.yml), avalia o código do PR e nunca abre PR de lock. Sem
# `ref`, se o eval passar e a corpus_version do staging estiver à frente do corpus.lock.json de
# develop, abre o PR do lock a partir do artifact `corpus-lock` do run que exportou essa versão
# (caso de um eval vermelho por causa do golden, corrigido depois), sem reingerir nada.
#
# - discover: `cli ingest discover` baixa cada fonte pelo SafeFetcher, confere sha256 e pins do
#   corpus/sources.yaml e grava `<out>/plan.json` + `<out>/extract-matrix.json` (os PDFs/XLSX sem
#   `docling.json` no store corpus-docling, já divididos por `page_range`). Os arquivos seguem como
#   o artifact `ingest-downloads`.
# - docling-models: garante o cache dos modelos do Docling (`docling-<hash do uv.lock>`); é o único
#   job que grava o cache, para os itens da matriz não disputarem o save.
# - extract: um job por item, `teko-ingest convert` (tools/ingest) → artifact
#   `docling-<sha256>[-p<início>-<fim>]`. Sem segredos e sem environment; HF_HUB_OFFLINE garante
#   que o Docling só usa os modelos do cache.
# - load: `cli ingest load --migrate` (desvio consciente da F3: o staging ainda não tinha migrações;
#   só com --target staging) sobe raw/docling ao BlobStore, grava as versões, embeddings (orçamento
#   EMBED_NEURON_BUDGET), cobertura, snapshot e atualiza corpus/corpus.lock.json. Código 75 =
#   orçamento de neurons do dia acabou: o job termina verde com status `budget_exhausted` e o
#   próximo run retoma pelo embedding_cache.
# - corpus-eval: retrieval evals (promptfoo, provider in-process) contra o staging, com embeddings
#   e reranker reais do Workers AI e o role teko_app, nos conjuntos dev e holdout do golden. O
#   registro (`corpus.eval.json`, métricas com intervalo de confiança e a corpus_version) vai para
#   o artifact `corpus-eval`.
# - corpus-eval-history: grava o registro no histórico (store eval-artifacts, GitHub Releases).
#   Job à parte, o único com escrita nos releases além do load, e nunca com o código de um PR
#   (`ref`): o eval-only de um PR roda no corpus-eval, que só lê.
# - lock-pr: só com o corpus-eval verde, abre o PR `chore(ingest): …` com o corpus/corpus.lock.json
#   e o corpus/corpus.eval.json, com o token da App teko-release-bot (commit pela API GraphQL,
#   assinado pelo GitHub, com Signed-off-by), branch `chore/corpus-lock-<run_id>`.
#
# Artefatos (raw, Docling, snapshots, histórico): GitHub Releases do repositório (ADR 0030), com
# o GITHUB_TOKEN do job; `contents: write` só no load e no corpus-eval-history. A migração da
# etapa C1 terminou em 2026-11-13 (run 43355872236).
#
# Produção nunca é tocada aqui: ela só recebe o corpus pelo `promote` do release.
name: Ingest

on:
  workflow_dispatch:
    inputs:
      target:
        description: Ambiente (só staging; produção recebe o corpus pelo promote do release)
        type: choice
        options: [staging]
        default: staging
      family:
        description: Família do corpus (vazio = todas)
        type: string
        default: ""
      bulk:
        description: Carga em massa (HNSW criado depois da carga; só staging)
        type: boolean
        default: false
      accept_churn:
        description: Libera o disjuntor de mudança em massa e o gate de saúde (os números ficam no relatório)
        type: boolean
        default: false
      max_pending_share:
        description: Fração pending máxima por família no gate de saúde (0 a 1; vazio = 0.15)
        type: string
        default: ""
      mode:
        description: full (ingestão completa) ou eval-only (só o corpus-eval contra o staging, ADR 0031)
        type: choice
        options: [full, eval-only]
        default: full
      ref:
        description: eval-only - SHA (40 caracteres) do commit a avaliar, de um PR do próprio repositório; vazio = o código do branch do dispatch
        type: string
        default: ""
  workflow_call:
    inputs:
      target:
        type: string
        default: staging
      family:
        type: string
        default: ""
      bulk:
        type: boolean
        default: false
      accept_churn:
        type: boolean
        default: false
      max_pending_share:
        type: string
        default: ""
      mode:
        type: string
        default: full
      ref:
        type: string
        default: ""
    # Num workflow chamado, o segredo do environment só chega ao job com `environment: staging` se
    # o chamador o repassar pelo nome (docs do GitHub: "Using inputs and secrets in a reusable
    # workflow"); por isso todos estão declarados aqui. Nunca `secrets: inherit`.
    secrets:
      RELEASE_APP_PRIVATE_KEY:
        description: Chave privada da App teko-release-bot (segredo do repositório), para o PR do lock.
        required: true
      NEON_STAGING_MIGRATE_URL:
        description: URL direta do owner do teko-staging (environment staging).
        required: false
      NEON_STAGING_APP_URL:
        description: URL do teko_app no teko-staging (environment staging), para o corpus-eval.
        required: false
      NEON_API_KEY_STAGING:
        description: API key do Neon (environment staging), para medir as CU-h do run.
        required: false
      CF_ACCOUNT_ID:
        description: Conta do Cloudflare (environment staging), Workers AI.
        required: false
      CF_AI_TOKEN:
        description: Token do Workers AI (environment staging).
        required: false

permissions: {}

concurrency:
  # Prefixo literal: chamado pelo source-watch, `github.workflow` seria o nome do chamador. Uma
  # ingestão nunca é cancelada no meio (a escrita é por versão de documento, mas o run soma neurons).
  group: ingest-staging
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  # Artefatos no GitHub Releases (ADR 0030). Explícito para a CLI exigir o GITHUB_TOKEN em vez de
  # cair, sem aviso, no store em memória.
  BLOB_STORE: github-releases

jobs:
  discover:
    name: discover
    # Modo eval-only: nada é baixado nem ingerido; discover, extract e load ficam pulados.
    if: ${{ inputs.mode != 'eval-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
      count: ${{ steps.matrix.outputs.count }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            www.gov.br:443
            sped.rfb.gov.br:80
            www.sped.fazenda.gov.br:443
            goias.gov.br:443
            www.goias.gov.br:443
            appasp.economia.go.gov.br:443

      - name: Conferir entradas e configuração do environment staging
        env:
          TARGET: ${{ inputs.target }}
          FAMILY: ${{ inputs.family }}
          NEON_STAGING_PROJECT_ID: ${{ vars.NEON_STAGING_PROJECT_ID }}
        run: |
          if [[ "$TARGET" != staging ]]; then
            echo "::error title=ingest::target '${TARGET}' não é aceito: a ingestão só roda no staging (produção recebe o corpus pelo promote do release)."
            exit 1
          fi
          if [[ ! "$FAMILY" =~ ^[a-z0-9-]*$ ]]; then
            echo "::error title=ingest::family inválida: use o id da família (ex.: rcte, efd-icms-ipi) ou vazio."
            exit 1
          fi
          missing=()
          # Os artefatos vão para o GitHub Releases com o GITHUB_TOKEN do próprio job (ADR 0030).
          if [[ "$BLOB_STORE" != github-releases ]]; then
            echo "::error title=ingest::BLOB_STORE '${BLOB_STORE}' desconhecido (só github-releases)."
            exit 1
          fi
          [[ -n "$NEON_STAGING_PROJECT_ID" ]] || missing+=("variável NEON_STAGING_PROJECT_ID (medição de CU-h)")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s; ' "${missing[@]}"
            echo "::error title=ingest::Faltam no environment 'staging': ${list%; }. Cadastre com 'gh variable set NOME --env staging' (ou 'gh secret set' para o segredo)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build da CLI (@teko/api → dist/cli.mjs)
        run: pnpm --filter @teko/api build

      - name: Descobrir versões das fontes (cli ingest discover)
        env:
          FAMILY: ${{ inputs.family }}
          OUT: ${{ runner.temp }}/ingest
          # O discover só lê os artefatos: o token de leitura do job basta.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(ingest discover --target staging --out "$OUT")
          [[ -n "$FAMILY" ]] && args+=(--family "$FAMILY")
          node apps/api/dist/cli.mjs "${args[@]}"

      - name: Matriz do extract (validada)
        id: matrix
        env:
          MATRIX_FILE: ${{ runner.temp }}/ingest/extract-matrix.json
        run: |
          if [[ ! -f "$MATRIX_FILE" ]]; then
            echo "::error title=ingest::O discover não gravou extract-matrix.json."
            exit 1
          fi
          # Cada item vira parâmetro de um job sem segredos: id, caminho e page_range passam por
          # validação estrita antes de entrar na matriz. URL em http só a do portal antigo do SPED
          # (Guias fixados por sha256, ADR 0028).
          jq -e '
            type == "array" and length <= 256 and all(.[];
              (.id | type == "string" and test("^[0-9a-f]{64}(-p[0-9]+-[0-9]+)?$")) and
              (.file | type == "string" and test("^[A-Za-z0-9._/-]+$") and (contains("..") | not) and (startswith("/") | not)) and
              (.sourceId | type == "string" and test("^[a-z0-9][a-z0-9./_-]*$")) and
              (.url | type == "string" and (startswith("https://") or startswith("http://sped.rfb.gov.br/"))) and
              ((.pageRange // null) == null or (.pageRange | type == "string" and test("^[0-9]+-[0-9]+$"))) and
              ((.ocr // false) | type == "boolean") and
              ((.timeoutSeconds // 3600) | type == "number" and . > 0 and . <= 18000)
            )' "$MATRIX_FILE" >/dev/null || {
            echo "::error title=ingest::extract-matrix.json fora do contrato (no máximo 256 itens; ver tools/ingest/README.md)."
            exit 1
          }
          # O docling-models só baixa layout e tableformer; o modelo de OCR padrão do Docling vem do
          # ModelScope, fora da allowlist. Fonte com `ocr: true` precisa primeiro do modelo no cache.
          if jq -e 'any(.[]; .ocr == true)' "$MATRIX_FILE" >/dev/null; then
            echo "::error title=ingest::Há fonte com ocr: true, mas o cache dos modelos não tem OCR. Inclua o modelo (e o host dele) no job docling-models antes de ligar o OCR."
            exit 1
          fi
          count="$(jq 'length' "$MATRIX_FILE")"
          echo "count=${count}" >>"$GITHUB_OUTPUT"
          echo "matrix=$(jq -c '{include: [.[] | {id, file, sourceId, url, pageRange: (.pageRange // ""), ocr: (.ocr // false), timeoutSeconds: (.timeoutSeconds // 3600)}]}' "$MATRIX_FILE")" >>"$GITHUB_OUTPUT"
          echo "- discover: ${count} item(ns) para o Docling" >>"$GITHUB_STEP_SUMMARY"

      - name: Guardar os arquivos baixados
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-downloads
          path: ${{ runner.temp }}/ingest
          if-no-files-found: error
          retention-days: 3

  docling-models:
    name: docling-models
    needs: discover
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/ingest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            huggingface.co:443
            *.huggingface.co:443
            *.hf.co:443
            releases.astral.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restaurar o cache dos modelos do Docling
        id: cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ingest/.cache/docling-models
          key: docling-${{ hashFiles('tools/ingest/uv.lock') }}-layout-tableformer

      - name: Instalar uv
        if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          working-directory: tools/ingest
          enable-cache: false

      # Só os modelos que o convert usa (layout e TableFormer V1, OCR desligado). Sem a lista, o
      # docling-tools baixa o conjunto padrão, com o OCR do RapidOCR vindo do ModelScope (modelscope.cn).
      # Mudou a lista? Mude também o sufixo da chave do cache, aqui e no extract.
      - name: Baixar os modelos (docling-tools)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          uv sync --frozen --extra docling
          uv run --frozen docling-tools models download --output-dir .cache/docling-models layout tableformer

      - name: Salvar o cache dos modelos
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ingest/.cache/docling-models
          key: docling-${{ hashFiles('tools/ingest/uv.lock') }}-layout-tableformer

  extract:
    name: extract (${{ matrix.id }})
    needs: [discover, docling-models]
    if: needs.discover.outputs.count != '0'
    runs-on: ubuntu-24.04
    # Documentos de mais de 5 h são divididos por page_range no corpus/sources.yaml.
    timeout-minutes: 330
    permissions:
      contents: read
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.discover.outputs.matrix) }}
    defaults:
      run:
        working-directory: tools/ingest
    env:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            pypi.org:443
            files.pythonhosted.org:443
            download.pytorch.org:443
            download-r2.pytorch.org:443
            releases.astral.sh:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          working-directory: tools/ingest
          enable-cache: true

      - name: Sincronizar ambiente com o Docling (uv.lock congelado)
        run: uv sync --frozen --extra docling

      - name: Restaurar os modelos do Docling
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: tools/ingest/.cache/docling-models
          key: docling-${{ hashFiles('tools/ingest/uv.lock') }}-layout-tableformer
          fail-on-cache-miss: true

      - name: Baixar os arquivos do discover
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ingest-downloads
          path: tools/ingest/work/in

      - name: Converter com o Docling (teko-ingest convert)
        env:
          ITEM_FILE: ${{ matrix.file }}
          ITEM_SOURCE_ID: ${{ matrix.sourceId }}
          ITEM_URL: ${{ matrix.url }}
          ITEM_PAGE_RANGE: ${{ matrix.pageRange }}
          ITEM_OCR: ${{ matrix.ocr }}
          ITEM_TIMEOUT: ${{ matrix.timeoutSeconds }}
        run: |
          args=(convert "work/in/${ITEM_FILE}" --source-id "$ITEM_SOURCE_ID" --url "$ITEM_URL"
            --out work/out --artifacts-path .cache/docling-models --timeout "$ITEM_TIMEOUT")
          [[ -n "$ITEM_PAGE_RANGE" ]] && args+=(--page-range "$ITEM_PAGE_RANGE")
          [[ "$ITEM_OCR" == true ]] && args+=(--ocr)
          start="$(date +%s)"
          uv run --frozen teko-ingest "${args[@]}"
          echo "- extract \`${ITEM_SOURCE_ID}\` ${ITEM_PAGE_RANGE:+(páginas ${ITEM_PAGE_RANGE}) }em $(( ($(date +%s) - start) / 60 )) min" >>"$GITHUB_STEP_SUMMARY"

      - name: Guardar a saída do Docling
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docling-${{ matrix.id }}
          path: tools/ingest/work/out
          if-no-files-found: error
          retention-days: 3

  load:
    name: load
    needs: [discover, extract]
    # Roda sem extract quando nenhum PDF/XLSX precisa de Docling (o job extract fica skipped).
    if: >-
      ${{ !cancelled() && needs.discover.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.extract.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    environment: staging
    # Grava raw, Docling e snapshots nos releases (ADR 0030).
    permissions:
      contents: write
    outputs:
      status: ${{ steps.load.outputs.status }}
      lock_changed: ${{ steps.lock.outputs.changed }}
      corpus_version: ${{ steps.lock.outputs.corpus_version }}
      db_bytes: ${{ steps.lock.outputs.db_bytes }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            uploads.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            api.cloudflare.com:443
            console.neon.tech:443
            *.neon.tech:5432

      - name: Conferir segredos e variáveis do environment staging
        env:
          NEON_STAGING_MIGRATE_URL: ${{ secrets.NEON_STAGING_MIGRATE_URL }}
          NEON_API_KEY_STAGING: ${{ secrets.NEON_API_KEY_STAGING }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          NEON_STAGING_PROJECT_ID: ${{ vars.NEON_STAGING_PROJECT_ID }}
        run: |
          missing=()
          required=(NEON_STAGING_MIGRATE_URL NEON_API_KEY_STAGING CF_ACCOUNT_ID CF_AI_TOKEN NEON_STAGING_PROJECT_ID)
          for name in "${required[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error title=ingest::Faltam no environment 'staging': ${list%, } (NEON_STAGING_PROJECT_ID é variável; os demais, segredos)."
            exit 1
          fi
          if [[ "$NEON_STAGING_MIGRATE_URL" != postgresql://* && "$NEON_STAGING_MIGRATE_URL" != postgres://* ]]; then
            echo "::error title=ingest::NEON_STAGING_MIGRATE_URL precisa começar com postgresql:// (URL direta do owner)."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build da CLI (@teko/api → dist/cli.mjs)
        run: pnpm --filter @teko/api build

      - name: Baixar os arquivos do discover
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ingest-downloads
          path: ${{ runner.temp }}/ingest

      - name: Baixar as saídas do Docling
        if: needs.discover.outputs.count != '0'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: docling-*
          path: ${{ runner.temp }}/docling
          merge-multiple: true

      - name: Carregar no staging (cli ingest load --migrate)
        id: load
        env:
          PLAN: ${{ runner.temp }}/ingest/plan.json
          DOCLING_DIR: ${{ runner.temp }}/docling
          REPORT: ${{ runner.temp }}/ingest-report.json
          BULK: ${{ inputs.bulk }}
          ACCEPT_CHURN: ${{ inputs.accept_churn }}
          MAX_PENDING_SHARE: ${{ inputs.max_pending_share }}
          # Opcional (variável do environment staging): bytes por chunk da guarda prospectiva.
          BYTES_PER_CHUNK: ${{ vars.INGEST_BYTES_PER_CHUNK }}
          DATABASE_URL: ${{ secrets.NEON_STAGING_MIGRATE_URL }}
          EMBEDDINGS_PROVIDER: workers-ai
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          NEON_API_KEY_STAGING: ${{ secrets.NEON_API_KEY_STAGING }}
          NEON_STAGING_PROJECT_ID: ${{ vars.NEON_STAGING_PROJECT_ID }}
        run: |
          mkdir -p "$DOCLING_DIR"
          # --report: JSON do run (neurons, linhas, versões, CU-h) para o artifact e a prova do orçamento.
          args=(ingest load --target staging --plan "$PLAN" --docling-dir "$DOCLING_DIR" --migrate --report "$REPORT")
          [[ "$BULK" == true ]] && args+=(--bulk)
          # --accept-churn: libera o disjuntor de mudança em massa e o gate de saúde.
          [[ "$ACCEPT_CHURN" == true ]] && args+=(--accept-churn)
          if [[ -n "$MAX_PENDING_SHARE" ]]; then
            if [[ ! "$MAX_PENDING_SHARE" =~ ^(0(\.[0-9]+)?|1(\.0+)?)$ ]]; then
              echo "::error title=ingest::max_pending_share precisa ser um número de 0 a 1 (recebido: '${MAX_PENDING_SHARE}')."
              exit 64
            fi
            args+=(--max-pending-share "$MAX_PENDING_SHARE")
          fi
          if [[ -n "$BYTES_PER_CHUNK" ]]; then
            export INGEST_BYTES_PER_CHUNK="$BYTES_PER_CHUNK"
          fi
          set +e
          node apps/api/dist/cli.mjs "${args[@]}"
          code=$?
          set -e
          case "$code" in
            0)
              echo "status=published" >>"$GITHUB_OUTPUT"
              ;;
            75)
              # EX_TEMPFAIL: o orçamento diário de neurons acabou; o próximo run retoma pelo cache.
              echo "status=budget_exhausted" >>"$GITHUB_OUTPUT"
              echo "::warning title=ingest::Orçamento diário de neurons esgotado (código 75): a ingestão retoma no próximo run, a partir do embedding_cache."
              ;;
            *)
              echo "::error title=ingest::cli ingest load terminou com código ${code}."
              exit "$code"
              ;;
          esac

      - name: Conferir o corpus/corpus.lock.json
        id: lock
        run: |
          # `status --porcelain` pega também o arquivo criado pela primeira vez (não rastreado).
          if [[ -z "$(git status --porcelain -- corpus/corpus.lock.json)" ]]; then
            echo "changed=false" >>"$GITHUB_OUTPUT"
          else
            echo "changed=true" >>"$GITHUB_OUTPUT"
            git diff --stat -- corpus/corpus.lock.json
          fi
          echo "corpus_version=$(jq -r '.corpusVersion // empty' corpus/corpus.lock.json 2>/dev/null || true)" >>"$GITHUB_OUTPUT"
          # Tamanho do staging no fechamento do run (pg_database_size): alvo de 400 MB, guarda de
          # 800 MB no load (o Neon Free para em 1 GB).
          db_bytes="$(jq -r '.dbBytes // empty' "${RUNNER_TEMP}/ingest-report.json" 2>/dev/null || true)"
          echo "db_bytes=${db_bytes}" >>"$GITHUB_OUTPUT"
          if [[ -n "$db_bytes" ]] && (( db_bytes > 400 * 1024 * 1024 )); then
            echo "::warning title=ingest::Staging com $(( db_bytes / 1024 / 1024 )) MB, acima do alvo de 400 MB (a guarda do load aborta em 800 MB)."
          fi

      - name: Guardar o corpus.lock.json
        if: steps.lock.outputs.changed == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          # Um arquivo só: fica na raiz do artifact (corpus.lock.json). 90 dias: com o corpus-eval
          # vermelho, o modo eval-only abre o PR do lock a partir deste artifact depois que o golden
          # for corrigido (ADR 0031).
          name: corpus-lock
          path: corpus/corpus.lock.json
          if-no-files-found: error
          retention-days: 90

      - name: Guardar o relatório do run
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ingest-report
          path: ${{ runner.temp }}/ingest-report.json
          if-no-files-found: ignore
          retention-days: 30

  corpus-eval:
    name: corpus-eval
    needs: load
    # Sem `!cancelled()`, o extract pulado pula este job. No modo eval-only o load fica pulado e o
    # eval roda contra o estado atual do staging.
    if: >-
      ${{ !cancelled() && (inputs.mode == 'eval-only'
      || (needs.load.result == 'success' && needs.load.outputs.status == 'published')) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    outputs:
      corpus_version: ${{ steps.record.outputs.corpus_version }}
    env:
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_SHARING: "1"
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_UPDATE: "1"
      PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            raw.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            api.cloudflare.com:443
            *.neon.tech:5432

      - name: Conferir entradas e segredos do environment staging
        env:
          MODE: ${{ inputs.mode }}
          REF: ${{ inputs.ref }}
          NEON_STAGING_APP_URL: ${{ secrets.NEON_STAGING_APP_URL }}
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
        run: |
          if [[ -n "$REF" && ( "$MODE" != eval-only || ! "$REF" =~ ^[0-9a-f]{40}$ ) ]]; then
            echo "::error title=corpus-eval::ref só vale no modo eval-only e precisa ser um SHA de 40 caracteres hexadecimais."
            exit 1
          fi
          names=(NEON_STAGING_APP_URL CF_ACCOUNT_ID CF_AI_TOKEN)
          missing=()
          for name in "${names[@]}"; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error title=ingest::Faltam no environment 'staging': ${list%, }."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Vazio = o commit do run (develop); no eval-only de um PR, o SHA do PR.
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Retrieval evals contra o staging, conjuntos dev e holdout (embeddings e reranker reais, role teko_app)
        env:
          APP_ENV: ci
          DATABASE_URL: ${{ secrets.NEON_STAGING_APP_URL }}
          EMBEDDINGS_PROVIDER: workers-ai
          # Reranker do Workers AI (ADR 0027), como a API terá em staging e produção.
          RERANKER_PROVIDER: workers-ai
          # Corpus real: a métrica de vigência usa o `staging_validity` do golden quando existe.
          EVAL_CORPUS: staging
          # Despeja os 50 primeiros candidatos (ordem do RRF) de cada caso no relatório, para
          # simular offline o número de candidatos do reranker (ADR 0027).
          EVAL_POOL_SIZE: "50"
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          # O BLOB_STORE do workflow (github-releases) exige o token na configuração; aqui ele só
          # lê (o job tem contents: read) e o eval não grava artefato.
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pnpm --filter @teko/api eval:retrieval
          pnpm --filter @teko/api eval:retrieval:holdout

      # Gate do corpus real (ADR 0031): retrieval-corpus no dev (trava contra regressão) e
      # retrieval-holdout no holdout (determinísticas em 1,00; recall e MRR informativos, meta de
      # MRR da F4), com intervalo de confiança no resumo. O registro liga o resultado à
      # corpus_version do staging (lida pelo teko_app) e vai ao PR do lock.
      - name: Gate e registro do corpus-eval (thresholds.json, retrieval-corpus e retrieval-holdout)
        id: record
        working-directory: apps/api
        env:
          APP_ENV: ci
          DATABASE_URL: ${{ secrets.NEON_STAGING_APP_URL }}
          EMBEDDINGS_PROVIDER: workers-ai
          RERANKER_PROVIDER: workers-ai
          CF_ACCOUNT_ID: ${{ secrets.CF_ACCOUNT_ID }}
          CF_AI_TOKEN: ${{ secrets.CF_AI_TOKEN }}
          GITHUB_TOKEN: ${{ github.token }}
          GIT_SHA: ${{ inputs.ref || github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: >-
          node evals/scripts/corpus-eval-record.ts build
          --dev reports/retrieval-evals.json --holdout reports/retrieval-evals-holdout.json
          --out reports/corpus.eval.json --pr-body reports/corpus-eval-pr.md
          --git-sha "$GIT_SHA" --run-url "$RUN_URL"

      - name: Guardar o resultado das evals
        if: ${{ !cancelled() }}
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: corpus-eval
          path: |
            apps/api/reports/retrieval-evals.json
            apps/api/reports/retrieval-evals-holdout.json
            apps/api/reports/corpus.eval.json
            apps/api/reports/corpus-eval-pr.md
          if-no-files-found: ignore
          retention-days: 90

  corpus-eval-history:
    name: corpus-eval-history
    needs: corpus-eval
    # Também com o gate vermelho (o histórico mostra a regressão), nunca para o código de um PR
    # (`ref`): este job roda o commit do run e é o único, além do load, com escrita nos releases.
    if: >-
      ${{ !cancelled() && inputs.ref == '' && needs.corpus-eval.result != 'skipped'
      && needs.corpus-eval.outputs.corpus_version != '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Baixar o registro do corpus-eval
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-eval
          path: apps/api/reports

      - name: Histórico do corpus-eval (store eval-artifacts)
        working-directory: apps/api
        env:
          APP_ENV: ci
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: node evals/scripts/corpus-eval-record.ts history --record reports/corpus.eval.json --run-id "$RUN_ID"

  lock-pr:
    name: lock-pr
    needs: [load, corpus-eval]
    # O lock só vai a PR com o corpus-eval verde (ADR 0031): no modo completo, quando o load mudou o
    # lock; no eval-only (sem `ref`), quando o staging está à frente do lock de develop. `!cancelled()`
    # e os resultados explícitos: o extract pulado não pode pular este job.
    if: >-
      ${{ !cancelled() && needs.corpus-eval.result == 'success' && inputs.ref == ''
      && ((inputs.mode != 'eval-only' && needs.load.result == 'success'
      && needs.load.outputs.lock_changed == 'true') || inputs.mode == 'eval-only') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # O GITHUB_TOKEN só lê (o lock de develop e os artifacts de outros runs); o PR sai com o token
    # da App, que é o que dispara o pr-gate no PR aberto.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443

      - name: Conferir a App teko-release-bot
        env:
          CLIENT_ID: ${{ vars.RELEASE_APP_CLIENT_ID }}
          PRIVATE_KEY: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
        run: |
          if [[ -z "$CLIENT_ID" || -z "$PRIVATE_KEY" ]]; then
            echo "::error title=ingest::Faltam a variável RELEASE_APP_CLIENT_ID ou o segredo RELEASE_APP_PRIVATE_KEY (nível do repositório)."
            exit 1
          fi

      - name: Baixar o resultado do corpus-eval
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-eval
          path: ${{ runner.temp }}/eval

      - name: Baixar o corpus.lock.json do load
        if: ${{ inputs.mode != 'eval-only' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: corpus-lock
          path: ${{ runner.temp }}/lock

      # Modo eval-only: o lock da corpus_version avaliada vem do artifact `corpus-lock` do run que a
      # exportou (o load grava o lock só quando o snapshot muda; retenção de 90 dias). Nada a abrir
      # se o staging não está à frente do lock de develop.
      - name: Resolver o lock da corpus_version avaliada
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          MODE: ${{ inputs.mode }}
          STAGING_VERSION: ${{ needs.corpus-eval.outputs.corpus_version }}
          LOCK_DIR: ${{ runner.temp }}/lock
        run: |
          set -euo pipefail
          lock="${LOCK_DIR}/corpus.lock.json"
          if [[ "$MODE" == eval-only ]]; then
            committed="$(gh api "repos/${REPO}/contents/corpus/corpus.lock.json?ref=develop" --jq .content | base64 -d | jq -r '.corpusVersion // 0')"
            if (( STAGING_VERSION <= committed )); then
              echo "::notice title=lock-pr::O staging (corpus_version ${STAGING_VERSION}) não está à frente do lock de develop (${committed}): nenhum PR de lock."
              echo "open=false" >>"$GITHUB_OUTPUT"
              exit 0
            fi
            mkdir -p "$LOCK_DIR"
            gh api "repos/${REPO}/actions/artifacts?name=corpus-lock&per_page=100" \
              --jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "develop")] | sort_by(.created_at) | reverse | .[] | "\(.id) \(.workflow_run.id)"' \
              >"${RUNNER_TEMP}/lock-artifacts.txt"
            found=""
            while read -r artifact run; do
              [[ -z "$artifact" ]] && continue
              gh api "repos/${REPO}/actions/artifacts/${artifact}/zip" >"${RUNNER_TEMP}/lock.zip"
              unzip -p "${RUNNER_TEMP}/lock.zip" corpus.lock.json >"${RUNNER_TEMP}/candidate.json"
              version="$(jq -r '.corpusVersion // 0' "${RUNNER_TEMP}/candidate.json")"
              if (( version == STAGING_VERSION )); then
                cp "${RUNNER_TEMP}/candidate.json" "$lock"
                found="$run"
                break
              fi
              # Os artifacts vêm do mais novo para o mais antigo: abaixo da versão avaliada, não há mais o que procurar.
              (( version < STAGING_VERSION )) && break
            done <"${RUNNER_TEMP}/lock-artifacts.txt"
            if [[ -z "$found" ]]; then
              echo "::error title=lock-pr::Nenhum artifact corpus-lock de develop com a corpus_version ${STAGING_VERSION} (retenção de 90 dias). Rode o ingest completo para exportar o snapshot de novo."
              exit 1
            fi
            echo "source_run=${found}" >>"$GITHUB_OUTPUT"
          fi
          jq -e 'type == "object"' "$lock" >/dev/null
          version="$(jq -r '.corpusVersion // empty' "$lock")"
          # O PR só leva a corpus_version que o corpus-eval avaliou.
          if [[ "$version" != "$STAGING_VERSION" ]]; then
            echo "::error title=lock-pr::O lock traz a corpus_version ${version:-nenhuma}, mas o corpus-eval avaliou a ${STAGING_VERSION}."
            exit 1
          fi
          echo "open=true" >>"$GITHUB_OUTPUT"
          echo "file=${lock}" >>"$GITHUB_OUTPUT"

      - name: Token da App teko-release-bot
        id: app-token
        if: steps.lock.outputs.open == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Abrir o PR do lock (commit assinado pela API)
        if: steps.lock.outputs.open == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          APP_SLUG: ${{ steps.app-token.outputs.app-slug }}
          REPO: ${{ github.repository }}
          # run_id, não run_number: o número é por workflow e colide entre o source-watch (que chama
          # este workflow) e o dispatch direto. O prefixo chore/corpus-lock- fecha os PRs antigos.
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SOURCE_RUN: ${{ steps.lock.outputs.source_run }}
          SERVER_URL: ${{ github.server_url }}
          CORPUS_VERSION: ${{ needs.corpus-eval.outputs.corpus_version }}
          LOCK_FILE: ${{ steps.lock.outputs.file }}
          EVAL_FILE: ${{ runner.temp }}/eval/corpus.eval.json
          EVAL_BODY: ${{ runner.temp }}/eval/corpus-eval-pr.md
        run: |
          set -euo pipefail
          jq -e --arg v "$CORPUS_VERSION" '.pass == true and .corpusVersion == ($v | tonumber)' "$EVAL_FILE" >/dev/null
          branch="chore/corpus-lock-${RUN_ID}"
          base_sha="$(gh api "repos/${REPO}/git/ref/heads/develop" --jq .object.sha)"
          gh api "repos/${REPO}/git/refs" -f ref="refs/heads/${branch}" -f sha="$base_sha" >/dev/null
          bot_id="$(gh api "users/${APP_SLUG}%5Bbot%5D" --jq .id)"
          signoff="Signed-off-by: ${APP_SLUG}[bot] <${bot_id}+${APP_SLUG}[bot]@users.noreply.github.com>"
          headline="chore(ingest): atualiza o corpus.lock.json${CORPUS_VERSION:+ (corpus_version ${CORPUS_VERSION})}"
          body="$(printf 'Snapshot exportado pela ingestão no staging e aprovado pelo corpus-eval (%s).\n\n%s' "$RUN_URL" "$signoff")"
          # createCommitOnBranch: o GitHub assina o commit em nome da App (commit "Verified"). O
          # resultado do corpus-eval vai junto, ao lado do lock (corpus/corpus.eval.json).
          jq -n \
            --arg repo "$REPO" --arg branch "$branch" --arg oid "$base_sha" \
            --arg headline "$headline" --arg body "$body" \
            --arg lock "$(base64 -w0 "$LOCK_FILE")" \
            --arg eval "$(base64 -w0 "$EVAL_FILE")" \
            '{query: "mutation($input: CreateCommitOnBranchInput!) { createCommitOnBranch(input: $input) { commit { oid url } } }",
              variables: {input: {
                branch: {repositoryNameWithOwner: $repo, branchName: $branch},
                expectedHeadOid: $oid,
                message: {headline: $headline, body: $body},
                fileChanges: {additions: [
                  {path: "corpus/corpus.lock.json", contents: $lock},
                  {path: "corpus/corpus.eval.json", contents: $eval}
                ]}
              }}}' >"${RUNNER_TEMP}/commit.json"
          gh api graphql --input "${RUNNER_TEMP}/commit.json" --jq '.data.createCommitOnBranch.commit.url'
          {
            echo "## O que muda"
            echo
            echo "Atualiza o \`corpus/corpus.lock.json\` com o snapshot exportado pela ingestão no staging${CORPUS_VERSION:+ (corpus_version ${CORPUS_VERSION})} e grava o resultado do \`corpus-eval\` em \`corpus/corpus.eval.json\`."
            echo
            echo "- Run: ${RUN_URL}"
            if [[ -n "$SOURCE_RUN" ]]; then
              echo "- Modo eval-only: o lock vem do run que exportou o snapshot (${SERVER_URL}/${REPO}/actions/runs/${SOURCE_RUN}); o corpus-eval deste run o aprovou, sem reingerir."
            fi
            echo "- A promoção para produção acontece no release (job \`promote-corpus\`), nunca aqui."
            echo
            cat "$EVAL_BODY"
          } >"${RUNNER_TEMP}/pr-body.md"
          url="$(gh pr create --repo "$REPO" --base develop --head "$branch" --title "$headline" --body-file "${RUNNER_TEMP}/pr-body.md")"
          echo "- PR do lock: ${url}" >>"$GITHUB_STEP_SUMMARY"
          # Cada PR do lock reescreve o arquivo inteiro: o novo substitui os anteriores ainda
          # abertos, que são fechados (com a branch apagada). Só os da própria App.
          new_number="${url##*/}"
          gh pr list --repo "$REPO" --state open --base develop --author "app/${APP_SLUG}" \
            --json number,headRefName \
            --jq '.[] | select(.headRefName | startswith("chore/corpus-lock-")) | .number' \
            >"${RUNNER_TEMP}/old-lock-prs.txt"
          while read -r old; do
            [[ -z "$old" || "$old" == "$new_number" ]] && continue
            gh pr close "$old" --repo "$REPO" --delete-branch \
              --comment "Substituído por #${new_number}: o PR do lock mais recente reescreve o \`corpus/corpus.lock.json\` inteiro."
            echo "- PR do lock anterior fechado: #${old}" >>"$GITHUB_STEP_SUMMARY"
          done <"${RUNNER_TEMP}/old-lock-prs.txt"

  summary:
    name: summary
    needs: [discover, docling-models, extract, load, lock-pr, corpus-eval]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443

      - name: Resumo da ingestão
        env:
          MODE: ${{ inputs.mode }}
          REF: ${{ inputs.ref }}
          FAMILY: ${{ inputs.family }}
          BULK: ${{ inputs.bulk }}
          ACCEPT_CHURN: ${{ inputs.accept_churn }}
          DISCOVER: ${{ needs.discover.result }}
          COUNT: ${{ needs.discover.outputs.count }}
          MODELS: ${{ needs.docling-models.result }}
          EXTRACT: ${{ needs.extract.result }}
          LOAD: ${{ needs.load.result }}
          LOAD_STATUS: ${{ needs.load.outputs.status }}
          CORPUS_VERSION: ${{ needs.load.outputs.corpus_version }}
          EVAL_VERSION: ${{ needs.corpus-eval.outputs.corpus_version }}
          DB_BYTES: ${{ needs.load.outputs.db_bytes }}
          LOCK_CHANGED: ${{ needs.load.outputs.lock_changed }}
          LOCK_PR: ${{ needs.lock-pr.result }}
          EVAL: ${{ needs.corpus-eval.result }}
        run: |
          {
            echo "### Ingestão no staging"
            echo
            echo "Modo: \`${MODE:-full}\`${REF:+ (código de \`${REF}\`)} · família: \`${FAMILY:-todas}\` · bulk: \`${BULK}\` · accept-churn: \`${ACCEPT_CHURN}\`"
            echo
            echo "| Etapa | Resultado |"
            echo "|---|---|"
            echo "| discover | ${DISCOVER} (${COUNT:-0} item(ns) para o Docling) |"
            echo "| docling-models | ${MODELS} |"
            echo "| extract | ${EXTRACT} |"
            echo "| load | ${LOAD} (${LOAD_STATUS:-sem status}) |"
            echo "| corpus.lock.json | ${LOCK_CHANGED:-false}${CORPUS_VERSION:+ (corpus_version ${CORPUS_VERSION})} |"
            if [[ -n "${DB_BYTES}" ]]; then
              echo "| tamanho do staging | $(( DB_BYTES / 1024 / 1024 )) MB (alvo ≤ 400 MB) |"
            else
              echo "| tamanho do staging | sem medida |"
            fi
            echo "| corpus-eval | ${EVAL}${EVAL_VERSION:+ (corpus_version ${EVAL_VERSION})} |"
            echo "| lock-pr | ${LOCK_PR} |"
            if [[ "$LOAD_STATUS" == budget_exhausted ]]; then
              echo
              echo "> Orçamento diário de neurons esgotado (código 75): rode de novo amanhã; a ingestão retoma pelo embedding_cache."
            fi
            if [[ "$LOCK_CHANGED" == true && "$EVAL" != success ]]; then
              echo
              echo "> O lock mudou, mas o corpus-eval não passou: o PR do lock espera. Se a falha for do golden, corrija-o e rode este workflow com \`mode: eval-only\`; o PR do lock sai do artifact \`corpus-lock\` deste run, sem reingerir."
            fi
          } >>"$GITHUB_STEP_SUMMARY"
          # O resumo não esconde falha: qualquer etapa vermelha deixa o run vermelho.
          for result in "$DISCOVER" "$MODELS" "$EXTRACT" "$LOAD" "$LOCK_PR" "$EVAL"; do
            [[ "$result" == failure || "$result" == cancelled ]] && exit 1
          done
          exit 0
