# Spike F1 (d): Neon teko-staging pelo -pooler (PgBouncer), com psql do runner.
#
#   1. Como owner (NEON_STAGING_MIGRATE_URL): grava no role teko_app os timeouts que a migração
#      inicial da F2 vai gravar (statement_timeout e idle_in_transaction_session_timeout em 5 s).
#   2. Como teko_app pelo -pooler (NEON_STAGING_APP_URL): SHOW dos timeouts, um pg_sleep acima do
#      teto (deve cair com 57014) e o mesmo timeout passado como parâmetro de conexão (o pooler deve
#      recusar ou ignorar: é por isso que o plano grava no role).
#   3. Scale-to-zero: espera o compute ficar ocioso (API do Neon) e mede a primeira query depois
#      do resume e a seguinte, registrando erro de reconexão (57P01, ECONNRESET), se houver.
#
# O attachDatabasePool só faz sentido com o pool pg dentro da Function; ele fica para a F2, junto
# com a decisão sobre o pg, que é publicado sem proveniência (ver ADR 0003). Nenhuma URL é impressa.
name: Spike F1 (d) - Neon pooler

on:
  workflow_dispatch:
    inputs:
      scale_to_zero:
        description: Esperar o compute suspender e medir o resume (até 10 min a mais)
        type: boolean
        default: true

permissions: {}

concurrency:
  group: spike-neon
  cancel-in-progress: false

jobs:
  neon:
    name: neon (teko-staging, -pooler)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    environment: staging
    permissions:
      contents: read
    env:
      PGCONNECT_TIMEOUT: "30"
      NEON_PROJECT_NAME: teko-staging
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Conferir segredos do environment staging
        env:
          OWNER_URL: ${{ secrets.NEON_STAGING_MIGRATE_URL }}
          APP_URL: ${{ secrets.NEON_STAGING_APP_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_STAGING }}
        run: |
          missing=()
          [[ -n "$OWNER_URL" ]] || missing+=("NEON_STAGING_MIGRATE_URL")
          [[ -n "$APP_URL" ]] || missing+=("NEON_STAGING_APP_URL (teko_app no host -pooler)")
          [[ -n "$NEON_API_KEY" ]] || missing+=("NEON_API_KEY_STAGING")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error title=spike-neon::Faltam segredos no environment 'staging': ${list%, }."
            exit 1
          fi
          if [[ "$APP_URL" != *-pooler.* ]]; then
            echo "::error title=spike-neon::NEON_STAGING_APP_URL precisa usar o host -pooler do Neon."
            exit 1
          fi
          psql --version

      - name: Timeouts no role teko_app (como owner)
        env:
          OWNER_URL: ${{ secrets.NEON_STAGING_MIGRATE_URL }}
        run: |
          psql "$OWNER_URL" -v ON_ERROR_STOP=1 -X -q <<'SQL'
          ALTER ROLE teko_app SET statement_timeout = '5s';
          ALTER ROLE teko_app SET idle_in_transaction_session_timeout = '5s';
          SQL
          echo "- timeouts gravados no role teko_app (statement_timeout e idle_in_transaction_session_timeout = 5s)" >>"$GITHUB_STEP_SUMMARY"

      - name: teko_app pelo -pooler
        env:
          APP_URL: ${{ secrets.NEON_STAGING_APP_URL }}
        run: |
          fail=0
          show="$(psql "$APP_URL" -X -A -t -c 'SHOW statement_timeout' -c 'SHOW idle_in_transaction_session_timeout' -c 'SELECT current_user' | paste -sd ' ' -)"
          echo "- teko_app pelo pooler: statement_timeout, idle_in_transaction_session_timeout, usuário = \`${show}\`" >>"$GITHUB_STEP_SUMMARY"
          [[ "$show" == "5s 5s teko_app" ]] || { echo "::error title=spike-neon::Os timeouts do role não valem pelo pooler (${show})."; fail=1; }

          # Acima do teto: o servidor cancela com 57014.
          sleep_err="$(psql "$APP_URL" -X -A -t -c 'SELECT pg_sleep(7)' 2>&1 >/dev/null || true)"
          echo "- pg_sleep(7) pelo pooler: \`${sleep_err:-sem erro}\`" >>"$GITHUB_STEP_SUMMARY"
          grep -q 'statement timeout' <<<"$sleep_err" || { echo "::error title=spike-neon::pg_sleep(7) não caiu no statement_timeout."; fail=1; }

          # O mesmo timeout como parâmetro de conexão (options), que o plano diz que o pooler não aceita.
          sep='?'; [[ "$APP_URL" == *\?* ]] && sep='&'
          param_out="$(psql "${APP_URL}${sep}options=-c%20statement_timeout%3D1s" -X -A -t -c 'SHOW statement_timeout' 2>&1 || true)"
          echo "- statement_timeout=1s como parâmetro de conexão pelo pooler: \`$(head -c 300 <<<"$param_out" | tr '\n' ' ')\`" >>"$GITHUB_STEP_SUMMARY"
          exit "$fail"

      - name: Resume depois do scale-to-zero
        if: inputs.scale_to_zero
        env:
          APP_URL: ${{ secrets.NEON_STAGING_APP_URL }}
          NEON_API_KEY: ${{ secrets.NEON_API_KEY_STAGING }}
        run: |
          api() { curl -sS --fail-with-body -H "Authorization: Bearer ${NEON_API_KEY}" -H 'Accept: application/json' "https://console.neon.tech/api/v2$1"; }
          project_id="$(api /projects | jq -r --arg name "$NEON_PROJECT_NAME" '.projects[] | select(.name == $name) | .id' | head -1)"
          if [[ -z "$project_id" ]]; then
            echo "::error title=spike-neon::Projeto Neon ${NEON_PROJECT_NAME} não encontrado com a NEON_API_KEY_STAGING."
            exit 1
          fi
          state() { api "/projects/${project_id}/endpoints" | jq -r '[.endpoints[] | select(.type == "read_write") | .current_state] | first // "desconhecido"'; }
          echo "estado inicial: $(state)"
          # Free: suspende após 5 min ociosos. Espera até 10 min, consultando a cada 30 s.
          for _ in $(seq 1 20); do
            current="$(state)"
            [[ "$current" == idle ]] && break
            sleep 30
          done
          echo "- compute antes da medição: \`${current}\`" >>"$GITHUB_STEP_SUMMARY"
          measure() {
            local start end out rc=0
            start="$(date +%s%3N)"
            out="$(psql "$APP_URL" -X -A -t -c 'SELECT 1' 2>&1)" || rc=$?
            end="$(date +%s%3N)"
            echo "$(( end - start )) ms, código ${rc}, saída: $(head -c 200 <<<"$out" | tr '\n' ' ')"
          }
          first="$(measure)"
          second="$(measure)"
          {
            echo "- primeira query depois do resume: \`${first}\`"
            echo "- query seguinte: \`${second}\`"
            echo "- o corte do proxy da Netlify é 26 s; a primeira query precisa caber nele junto com o cold start da Function"
          } >>"$GITHUB_STEP_SUMMARY"
          [[ "$current" == idle ]] || echo "::warning title=spike-neon::O compute não suspendeu dentro da espera; a medição pode não ter pego um resume."
