# SonarQube Cloud, só informativo (ADR 0032): fora do `ci-gate`, nunca bloqueia um PR.
#
# Chamado pelo pr-gate.yml (job `sonar`, depois do `ci`, em paralelo com o `ci-gate`) e pelo ci.yml
# em push para develop. Roda no mesmo run de quem chama, então baixa os artifacts de cobertura que
# os jobs test, integration e python do ci.yml guardaram (os que existirem: um job pulado por
# escopo não guarda nada). A análise automática fica DESLIGADA no projeto; escopo, exclusões e
# caminhos de cobertura ficam em sonar-project.properties.
#
# O quality gate aparece no PR pelo App da SonarQube Cloud (decoração e check "SonarQube Cloud Code
# Analysis"), que NÃO deve ser exigido nos rulesets. O job tem `continue-on-error`: nem o quality
# gate nem uma queda do SonarQube Cloud deixam o run vermelho.
name: Sonar

on:
  workflow_call:
    secrets:
      SONAR_TOKEN:
        description: >-
          Token da SonarQube Cloud. Em PR do Dependabot vem dos segredos do Dependabot; ausente em PR
          de fork, e então a análise é pulada.
        required: false

permissions: {}

jobs:
  sonar:
    name: sonar
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Conferir token e variáveis do Sonar
        id: preflight
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          # PRs de fork não recebem segredos; os do Dependabot só recebem os segredos do
          # Dependabot (SONAR_TOKEN precisa estar cadastrado lá também). Sem token, pula.
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::notice title=sonar::SONAR_TOKEN indisponível neste evento (fork, ou Dependabot sem o segredo do Dependabot); análise do SonarQube Cloud pulada."
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${SONAR_ORGANIZATION}" || -z "${SONAR_PROJECT_KEY}" ]]; then
            echo "::error title=sonar::Defina as variáveis de repositório SONAR_ORGANIZATION e SONAR_PROJECT_KEY."
            exit 1
          fi
          echo "run=true" >>"$GITHUB_OUTPUT"

      - name: Checkout (histórico completo para blame e código novo)
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        # As dependências instaladas dão ao analisador de TypeScript os tipos reais dos pacotes.
        if: steps.preflight.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: Baixar os artifacts de cobertura deste run
        # Padrão sem nenhum artifact (todos os jobs de teste pulados) termina com 0 baixados.
        if: steps.preflight.outputs.run == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-*
          path: ${{ runner.temp }}/coverage

      - name: Pôr a cobertura no lugar, com caminhos a partir da raiz
        if: steps.preflight.outputs.run == 'true'
        env:
          COVERAGE_DIR: ${{ runner.temp }}/coverage
        run: |
          shopt -s nullglob
          # Com um artifact só, o download-artifact extrai direto em COVERAGE_DIR; com vários, cada
          # um vai para COVERAGE_DIR/<nome>. Os três guardam caminhos diferentes:
          #   coverage-lcov: apps/*/coverage/lcov.info e packages/*/coverage/lcov.info (raiz do repo);
          #   coverage-lcov-integration: lcov.info (de apps/api/coverage-integration);
          #   coverage-python: coverage.xml (de tools/ingest).
          for dir in "$COVERAGE_DIR" "$COVERAGE_DIR"/coverage-*; do
            [[ -d "$dir" ]] || continue
            for lcov in "$dir"/apps/*/coverage/lcov.info "$dir"/packages/*/coverage/lcov.info; do
              rel="${lcov#"$dir"/}"
              mkdir -p "$(dirname "$rel")"
              cp "$lcov" "$rel"
            done
          done
          for name in coverage-lcov-integration coverage-python; do
            src="$COVERAGE_DIR/$name"
            [[ -d "$src" ]] || src="$COVERAGE_DIR"
            if [[ "$name" == coverage-lcov-integration && -f "$src/lcov.info" ]]; then
              mkdir -p apps/api/coverage-integration
              cp "$src/lcov.info" apps/api/coverage-integration/lcov.info
            elif [[ "$name" == coverage-python && -f "$src/coverage.xml" ]]; then
              cp "$src/coverage.xml" tools/ingest/coverage.xml
            fi
          done
          # O Vitest grava `SF:src/...` relativo ao pacote; o Sonar resolve caminhos relativos
          # contra a raiz do projeto. Caminhos absolutos ficam como estão.
          for lcov in apps/*/coverage/lcov.info apps/*/coverage-integration/lcov.info packages/*/coverage/lcov.info; do
            pkg="${lcov%/coverage*/lcov.info}"
            sed -i -E "\#^SF:${pkg}/#! s#^SF:([^/])#SF:${pkg}/\1#" "$lcov"
            echo "${lcov}: $(grep -c '^SF:' "$lcov") arquivo(s)"
          done
          if [[ -f tools/ingest/coverage.xml ]]; then
            echo "tools/ingest/coverage.xml"
          fi

      - name: Análise SonarQube Cloud (informativa)
        if: steps.preflight.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
