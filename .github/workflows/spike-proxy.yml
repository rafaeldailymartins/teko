# Spike F1 (c): proxy assinado da Netlify (alias develop do site tekoia) → teko-api-staging.
#
# Spike encerrado: os resultados (claims e verificação do x-nf-sign, Cookie e Set-Cookie,
# headers de IP forjados, cache, WAF, latência) estão na docs/adr/0003-f1-spikes.md. O eco
# temporário /api/_spike/echo saiu da API, junto com o passo que o usava; o que dependia dele
# (x-nf-sign, IPs, cookies) volta a ser conferido com o plugin netlifySignature da F4. O workflow
# fica como referência para o smoke da F7 e registra no resumo do job, só com /healthz e
# /api/healthz:
#   - ausência de cache na Netlify e na Vercel (headers de duas chamadas pelo proxy);
#   - regra 2 do WAF (chamada direta a /api/v1/* sem x-nf-sign) e o domínio de produção público,
#     direto e pelo proxy;
#   - latência extra Netlify → gru1 (mediana de /api/healthz direto e proxiado).
#
# Só `workflow_dispatch` e só no environment `staging`. Não publica nada: só faz requisições.
name: Spike F1 (c) - proxy Netlify para Vercel

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: spike-proxy
  cancel-in-progress: false

jobs:
  proxy:
    name: proxy (develop--tekoia → teko-api-staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: staging
    permissions:
      contents: read
    env:
      DIRECT: https://teko-api-staging.vercel.app
      PROXIED: https://develop--tekoia.netlify.app
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: WAF e Deployment Protection
        run: |
          # Regra 2 do WAF (F7): /api/v1/* direto, sem x-nf-sign, deveria dar 403 quando aplicada.
          waf="$(curl -sS -o /dev/null -w '%{http_code}' "${DIRECT}/api/v1/coverage")"
          public="$(curl -sS -o /dev/null -w '%{http_code}' "${DIRECT}/healthz")"
          proxied="$(curl -sS -o /dev/null -w '%{http_code}' "${PROXIED}/api/healthz")"
          {
            echo "## Spike F1 (c): proxy Netlify → Vercel"
            echo
            echo "- /api/v1/coverage direto sem x-nf-sign: HTTP \`${waf}\` (403 = regra 2 do WAF ativa; 404 = sem WAF, a rota não existe na F1)"
            echo "- domínio de produção público: /healthz HTTP \`${public}\`; pelo proxy: /api/healthz HTTP \`${proxied}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          [[ "$public" == 200 && "$proxied" == 200 ]]

      - name: Sem cache no caminho (duas chamadas pelo proxy)
        run: |
          for n in 1 2; do
            curl -sS --fail-with-body -o /dev/null -D "${RUNNER_TEMP}/proxied-${n}.headers" "${PROXIED}/api/healthz"
            sleep 2
          done
          curl -sS --fail-with-body -o /dev/null -D "${RUNNER_TEMP}/direct.headers" "${DIRECT}/api/healthz"
          cache_headers() {
            grep -iE '^(cache-control|cache-status|age|x-vercel-cache):' "$1" | tr -d '\r' | paste -sd ';' - || true
          }
          {
            echo "- cache direto: \`$(cache_headers "${RUNNER_TEMP}/direct.headers")\`"
            echo "- cache pelo proxy (1ª chamada): \`$(cache_headers "${RUNNER_TEMP}/proxied-1.headers")\`"
            echo "- cache pelo proxy (2ª chamada): \`$(cache_headers "${RUNNER_TEMP}/proxied-2.headers")\`"
          } >>"$GITHUB_STEP_SUMMARY"
          # Na ADR 0003: `cache-status: "Netlify Edge"; fwd=miss` e `x-vercel-cache: MISS`. Um hit
          # da Netlify ou da Vercel na segunda chamada indica cache no caminho.
          if grep -iqE '^(cache-status:.*; *hit|x-vercel-cache: *(HIT|STALE))' "${RUNNER_TEMP}/proxied-2.headers"; then
            echo "::error title=spike-proxy::A segunda chamada pelo proxy veio de cache (ver o resumo)."
            exit 1
          fi

      - name: Latência extra Netlify → gru1
        run: |
          sample() {
            local url="$1"
            for _ in $(seq 1 15); do
              curl -sS -o /dev/null -w '%{time_total}\n' "$url"
            done | sort -n | awk '{a[NR] = $1} END {printf "%.0f %.0f %.0f\n", a[1] * 1000, a[int((NR + 1) / 2)] * 1000, a[NR] * 1000}'
          }
          # A primeira chamada de cada lado entra na amostra: com a instância fria, ela mostra o cold start.
          read -r d_min d_med d_max < <(sample "${DIRECT}/api/healthz")
          read -r p_min p_med p_max < <(sample "${PROXIED}/api/healthz")
          {
            echo "- latência /api/healthz (ms, 15 amostras do runner do GitHub, mín/mediana/máx): direto \`${d_min}/${d_med}/${d_max}\`, proxiado \`${p_min}/${p_med}/${p_max}\`; extra pela Netlify (mediana) \`$(( p_med - d_med ))\` ms"
            echo "- o corte do proxy da Netlify é 26 s; a pior chamada proxiada levou \`${p_max}\` ms"
          } >>"$GITHUB_STEP_SUMMARY"
          (( p_max < 26000 ))
