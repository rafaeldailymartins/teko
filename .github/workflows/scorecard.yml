# OpenSSF Scorecard, com resultados publicados (badge e API pública).
# Com publish_results, a API do Scorecard só aceita o run se o workflow respeitar as restrições
# da action: sem env/defaults no topo ou no job, sem permissões de escrita no topo, `id-token`
# só neste job, runner Ubuntu hospedado e apenas checkout, upload-artifact, upload-sarif,
# scorecard-action e harden-runner como steps. Não acrescente outros steps aqui.
# Metas: >= 7 em v0.1.0 e >= 8 em v0.2.0.
name: Scorecard

on:
  # O Scorecard só suporta push e schedule no branch default (main).
  push:
    branches: [main]
  schedule:
    - cron: "17 4 * * 1" # segunda, 04:17 UTC

permissions: {}

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: false

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read # checks que leem execuções de workflow (ex.: Dangerous-Workflow, CI-Tests)
      security-events: write # upload do SARIF para o code scanning
      id-token: write # publicação dos resultados (publish_results)
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Rodar Scorecard
        uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - name: Guardar o SARIF como artefato
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-sarif
          path: results.sarif
          retention-days: 5

      - name: Enviar ao code scanning
        uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
