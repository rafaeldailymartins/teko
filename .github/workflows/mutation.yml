# Testes de mutação (StrykerJS 10, vitest-runner + typescript-checker), break 70 em apps/api
# (domain e application) e packages/shared. Plano: Qualidade > Cobertura, mutação e arquitetura.
#
# Fora do PR desde a ADR 0032: era o caminho crítico do `ci-gate` (4 a 7 min) e o score é estável
# entre commits. Roda:
# - toda noite, em develop, só se houver commit novo desde o último run verde deste workflow
#   (o job `changes` compara o SHA); sem commit novo, o `stryker` é pulado;
# - por dispatch, sempre (para conferir uma mudança no próprio workflow ou na config do Stryker).
#
# O relatório incremental (cache) faz o Stryker testar só os mutantes do código que mudou desde a
# rodada anterior. O reporter `dashboard` publica no Stryker Dashboard (badge do README) com o
# STRYKER_DASHBOARD_API_KEY. Score abaixo de 70 deixa o run vermelho e notifica o mantenedor.
name: Mutation

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  changes:
    name: changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # listar os runs anteriores deste workflow
    outputs:
      run: ${{ steps.compare.outputs.run }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Commit novo desde o último run verde?
        id: compare
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          SHA: ${{ github.sha }}
        run: |
          if [[ "$EVENT_NAME" != schedule ]]; then
            echo "Evento '${EVENT_NAME}': roda sempre."
            echo "run=true" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          last="$(gh run list --repo "$REPO" --workflow mutation.yml --branch "$REF_NAME" \
            --status success --limit 1 --json headSha --jq '.[0].headSha // ""')"
          if [[ "$last" == "$SHA" ]]; then
            echo "::notice title=mutation::Sem commit novo desde o último run verde (${SHA:0:12}); Stryker pulado."
            echo "run=false" >>"$GITHUB_OUTPUT"
          else
            echo "Último run verde em ${last:-nenhum}; agora ${SHA}."
            echo "run=true" >>"$GITHUB_OUTPUT"
          fi

  stryker:
    name: stryker
    needs: changes
    if: needs.changes.outputs.run == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Restaurar relatórios incrementais do Stryker
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/api/reports/stryker-incremental.json
            packages/shared/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
          restore-keys: |
            stryker-incremental-

      - name: Stryker (todos os pacotes)
        env:
          STRYKER_DASHBOARD_API_KEY: ${{ secrets.STRYKER_DASHBOARD_API_KEY }}
        run: pnpm exec turbo run test:mutation --concurrency=1 --force

      - name: Guardar o relatório HTML
        if: ${{ !cancelled() }}
        # Só diagnóstico: o gate é o passo do Stryker. Uma falha transitória da API de artifacts do
        # GitHub (FinalizeArtifact devolvendo HTML, PR #24) não pode reprovar uma mutação aprovada.
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: |
            apps/api/reports/mutation/
            packages/shared/reports/mutation/
          if-no-files-found: ignore
          retention-days: 14

      - name: Salvar relatórios incrementais
        if: ${{ !cancelled() }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            apps/api/reports/stryker-incremental.json
            packages/shared/reports/stryker-incremental.json
          key: stryker-incremental-${{ github.sha }}
