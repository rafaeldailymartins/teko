# Migração dos artefatos da ingestão do Netlify Blobs para o GitHub Releases (ADR 0030, etapa C1).
#
# `cli ingest blobs-migrate` lista cada store do Netlify Blobs (corpus-raw e corpus-docling, que
# são o cache do Docling; corpus-snapshots, da promoção; corpus-manifests, do watch; e
# eval-artifacts) e copia cada chave para os releases do próprio repositório, conferindo o sha256
# depois de gravar. É idempotente: rodar de novo só copia o que falta ou diverge. Rode primeiro com
# `dry_run`, depois sem; com o resumo verde (failed = 0) duas vezes seguidas, a etapa C2 troca o
# BLOB_STORE do ingest.yml e do source-watch.yml para github-releases e apaga este workflow.
#
# Divide o grupo de concorrência do ingest.yml: nenhuma ingestão grava no Netlify durante a cópia.
# Rode fora das 09:00 UTC (o source-watch grava o watch-state nesse horário).
name: Blobs migrate

on:
  workflow_dispatch:
    inputs:
      store:
        description: Store a migrar (all = todos, na ordem do cache do Docling primeiro)
        type: choice
        options:
          [all, corpus-raw, corpus-docling, corpus-snapshots, corpus-manifests, eval-artifacts]
        default: all
      dry_run:
        description: Só contar o que seria copiado, sem gravar nos releases
        type: boolean
        default: true

permissions: {}

concurrency:
  group: ingest-staging
  cancel-in-progress: false

env:
  TURBO_TELEMETRY_DISABLED: "1"

jobs:
  migrate:
    name: migrate
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    # O environment staging tem o NETLIFY_AUTH_TOKEN (segredo) e o NETLIFY_SITE_ID (variável).
    environment: staging
    permissions:
      # Cria releases e sobe assets com o GITHUB_TOKEN do job.
      contents: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: block
          allowed-endpoints: >
            github.com:443
            api.github.com:443
            uploads.github.com:443
            codeload.github.com:443
            objects.githubusercontent.com:443
            release-assets.githubusercontent.com:443
            results-receiver.actions.githubusercontent.com:443
            *.actions.githubusercontent.com:443
            *.blob.core.windows.net:443
            registry.npmjs.org:443
            nodejs.org:443
            api.netlify.com:443
            *.s3.us-east-2.amazonaws.com:443
            *.s3.dualstack.us-east-2.amazonaws.com:443

      - name: Conferir o PAT e o site da Netlify (environment staging)
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
        run: |
          missing=()
          [[ -n "$NETLIFY_AUTH_TOKEN" ]] || missing+=("segredo NETLIFY_AUTH_TOKEN")
          [[ -n "$NETLIFY_SITE_ID" ]] || missing+=("variável NETLIFY_SITE_ID (id do site tekoia)")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s; ' "${missing[@]}"
            echo "::error title=blobs-migrate::Faltam no environment 'staging': ${list%; }."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Build da CLI (@teko/api → dist/cli.mjs)
        run: pnpm --filter @teko/api build

      - name: Migrar (cli ingest blobs-migrate)
        env:
          STORE: ${{ inputs.store }}
          DRY_RUN: ${{ inputs.dry_run }}
          REPORT: ${{ runner.temp }}/blobs-migrate.jsonl
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ vars.NETLIFY_SITE_ID }}
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          args=(ingest blobs-migrate)
          [[ "$STORE" != all ]] && args+=(--store "$STORE")
          [[ "$DRY_RUN" == true ]] && args+=(--dry-run)
          set +e
          node apps/api/dist/cli.mjs "${args[@]}" >"$REPORT"
          code=$?
          set -e
          cat "$REPORT"
          {
            echo "### Blobs migrate (dry_run=${DRY_RUN}, store=${STORE})"
            echo
            echo "| Store | Total | Copiados | Já iguais | Falhas |"
            echo "|---|---|---|---|---|"
            jq -r 'select(has("store")) | "| \(.store) | \(.total) | \(.copied) | \(.skipped) | \(.failed | length) |"' "$REPORT"
            echo
            jq -r 'select(has("store")) | .store as $s | .failed[] | "- falha em \($s)/\(.key): \(.error)"' "$REPORT"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ "$code" != 0 ]]; then
            echo "::error title=blobs-migrate::cli ingest blobs-migrate terminou com código ${code} (ver o resumo)."
          fi
          exit "$code"
