# Gates de qualidade. Em PR, roda chamado pelo pr-gate.yml (que passa o escopo afetado em
# `inputs.affected`); em push para develop/main, recalcula o escopo sozinho.
#
# Desde a F2: `migration-guard` (PR em api) e as retrieval evals (se `rag`/`ingest` afetados).
# Ainda não está aqui (entra na F5): Storybook (`vitest --project storybook`).
name: CI

on:
  workflow_call:
    inputs:
      affected:
        description: >-
          JSON do job `affected` do pr-gate.yml
          ({web, api, shared, ingest, rag, llm, packages}). Vazio = recalcular aqui.
        type: string
        required: false
        default: ""
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  # Prefixo literal: num workflow chamado, `github.workflow` é o nome do chamador, e reaproveitá-lo
  # cancelaria o próprio pr-gate.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  OPENSPEC_TELEMETRY: "0"
  # Base do `--affected` do turbo: a base do PR, ou o commit anterior do push. Um `before` nulo
  # (primeiro push do branch) não resolve, e o turbo então considera tudo afetado.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      json: ${{ steps.from-caller.outputs.json || steps.computed.outputs.json }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Usar o escopo recebido do pr-gate
        id: from-caller
        if: inputs.affected != ''
        env:
          AFFECTED: ${{ inputs.affected }}
        run: |
          jq -e 'has("packages") and has("ingest")' <<<"$AFFECTED" >/dev/null
          echo "json=$(jq -c . <<<"$AFFECTED")" >>"$GITHUB_OUTPUT"

      - name: Checkout (histórico completo)
        if: inputs.affected == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        if: inputs.affected == ''
        uses: ./.github/actions/setup

      - name: Calcular escopo afetado
        id: computed
        if: inputs.affected == ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/affected.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Biome
        run: pnpm lint

      - name: Lockfiles em documento único (raiz, tools/vercel-cli e tools/netlify-cli)
        # O script verifica uma lista fixa: o lockfile da raiz e os dos projetos isolados dos CLIs de
        # deploy (lidos pelo Dependabot e pelos jobs de deploy), sem argumentos.
        run: pnpm check-lockfile

      - name: Consistência do monorepo (sherif)
        run: pnpm lint:monorepo

      - name: Código e dependências não usados (knip)
        run: pnpm knip

      - name: OpenSpec
        env:
          OPENSPEC_TELEMETRY: "0"
        run: pnpm spec:validate

      - name: Typecheck dos scripts da raiz
        run: pnpm typecheck:scripts

      # node:test nativo (Node 24): os scripts ficam fora dos pacotes, e o turbo boundaries proíbe
      # que um pacote importe arquivos de fora dele.
      - name: Testes dos scripts da raiz
        run: pnpm test:scripts

      - name: Duplicação (jscpd, 3%, min-tokens 70)
        run: pnpm dup

      - name: Fronteiras entre pacotes (turbo boundaries)
        # Sem tags, confere imports de arquivos fora do pacote e dependências não declaradas;
        # com as tags dos turbo.json dos pacotes, também as regras de `boundaries` da raiz.
        run: pnpm exec turbo boundaries

      - name: Testes do escopo afetado (affected.sh e grafo do turbo)
        run: bash .github/scripts/affected.test.sh

      - name: Testes da configuração de CI
        run: bash .github/scripts/ci-config.test.sh

      - name: Testes do migration-guard
        run: bash .github/scripts/migration-guard.test.sh

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  typecheck:
    name: typecheck
    needs: scope
    if: fromJSON(needs.scope.outputs.json).packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Typecheck (tsc 7), dependency-cruiser, steiger e type-coverage
        # A task `transit` do turbo.json põe os inputs do packages/shared no hash de api/web, então
        # uma mudança só no shared também roda os checks dos dependentes.
        run: pnpm exec turbo run typecheck lint:deps lint:fsd type-coverage --affected

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  test:
    name: test
    needs: scope
    # Em push roda sempre: a análise de branch do Sonar mede a cobertura de todo o código novo do
    # período, e um push sem pacote afetado (só docs ou config) sem lcov derrubava o quality gate
    # com new_coverage 0%. Os pacotes sem mudança saem do cache do Turbo.
    if: github.event_name == 'push' || fromJSON(needs.scope.outputs.json).packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Testes unitários com cobertura
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR: só os pacotes afetados (a análise de PR do Sonar olha só o código novo). Push:
          # todos, para o Sonar receber a cobertura completa do branch; os
          # pacotes sem mudança saem do cache do Turbo, que restaura o coverage/ como output.
          if [[ "$EVENT_NAME" == push ]]; then
            pnpm exec turbo run test:unit
          else
            pnpm exec turbo run test:unit --affected
          fi

      - name: Guardar o lcov para o job sonar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          # Dois caminhos: a raiz do artifact é o ancestral comum (a raiz do repo), então os
          # arquivos chegam ao sonar como apps/<app>/coverage/lcov.info e packages/<p>/...
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 1

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  integration:
    name: integration
    needs: scope
    # Em push roda sempre, como o `test`: o Sonar da branch precisa do lcov da integração (a
    # persistência e a CLI só são exercitadas contra o Postgres). Sem mudança, sai do cache do Turbo.
    if: github.event_name == 'push' || fromJSON(needs.scope.outputs.json).api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Testes de integração com cobertura (Testcontainers no Docker do runner)
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == push ]]; then
            pnpm exec turbo run test:integration
          else
            pnpm exec turbo run test:integration --affected
          fi

      - name: Guardar o lcov da integração para o job sonar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov-integration
          path: apps/api/coverage-integration/lcov.info
          if-no-files-found: ignore
          retention-days: 1

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  # Migrações expand/contract: DROP/RENAME só com o label `contract`; CONCURRENTLY e alteração de
  # migração publicada nunca. Só em PR (em push a migração já passou pelo PR).
  migration-guard:
    name: migration-guard
    needs: scope
    if: github.event_name == 'pull_request' && fromJSON(needs.scope.outputs.json).api
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o diff contra a base)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Conferir as migrações do PR
        env:
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: bash .github/scripts/migration-guard.sh

  # Retrieval evals sem LLM (plano: Avaliação (a)): o RetrieveEvidence in-process contra um Postgres
  # de serviço com a fixture única e o fake de embeddings em modo strict. Sem segredo nenhum, então
  # roda também em PR de fork. Gate: evals/thresholds.json (recall@10, MRR, vigência, recusa...).
  retrieval-evals:
    name: retrieval-evals
    needs: scope
    if: fromJSON(needs.scope.outputs.json).rag || fromJSON(needs.scope.outputs.json).ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    services:
      postgres:
        # Mesma imagem do Testcontainers (test/setup/postgres.global.ts): pgvector 0.8.6 + PG 18.
        image: pgvector/pgvector:0.8.6-pg18-trixie@sha256:78bf48b801e792f99e3ac62b5036fd3876e9be48afda16c1e331af1c75ceb2ff
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres-ci-only
          POSTGRES_DB: teko
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d teko"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      # Senha só do container efêmero do job (não é segredo de nenhum ambiente).
      DATABASE_URL: postgresql://postgres:postgres-ci-only@localhost:5432/teko
      EMBEDDINGS_PROVIDER: fake
      EMBEDDINGS_FAKE_STRICT: "true"
      EMBEDDINGS_FIXTURE_PATH: test/fixtures/corpus/embeddings.json.gz
      PROMPTFOO_DISABLE_TELEMETRY: "1"
      PROMPTFOO_DISABLE_SHARING: "1"
      PROMPTFOO_DISABLE_REMOTE_GENERATION: "true"
      PROMPTFOO_DISABLE_UPDATE: "1"
      # Assert reprovado não derruba o passo (o gate é o check-thresholds); erro do provider, sim.
      PROMPTFOO_FAILED_TEST_EXIT_CODE: "0"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Migrar e gravar a fixture única
        run: pnpm --filter @teko/api seed:fixtures

      - name: Retrieval evals (promptfoo, provider in-process)
        run: pnpm --filter @teko/api eval:retrieval

      - name: Gate das retrieval evals (thresholds.json)
        run: pnpm --filter @teko/api eval:retrieval:check

      - name: Guardar o resultado das evals
        if: ${{ !cancelled() }}
        # Só diagnóstico: o gate é o passo anterior (check-thresholds).
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: retrieval-evals
          path: apps/api/reports/retrieval-evals.json
          if-no-files-found: ignore
          retention-days: 14

  build:
    name: build
    needs: scope
    if: fromJSON(needs.scope.outputs.json).packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Build
        run: pnpm exec turbo run build --affected

      - name: Garantir o build do web (para o guard)
        # O --affected do turbo usa os inputs da task; isto garante o out/ quando o escopo diz que
        # o web foi afetado (cache hit se o passo anterior já o construiu).
        if: fromJSON(needs.scope.outputs.json).web
        run: pnpm exec turbo run build --filter=@teko/web

      - name: Guard do export estático (0 functions)
        if: fromJSON(needs.scope.outputs.json).web
        working-directory: apps/web
        run: |
          fail=0
          if [[ ! -f out/index.html ]]; then
            echo "::error title=static-export::apps/web/out/index.html não existe: o build não gerou export estático (output: 'export')."
            fail=1
          fi
          functions="$(find . -path ./node_modules -prune -o -type d \( -path '*/.netlify/functions*' -o -path '*/.netlify/edge-functions*' \) -print)"
          if [[ -n "$functions" ]]; then
            echo "::error title=static-export::O build gerou functions da Netlify:"
            echo "$functions"
            fail=1
          fi
          manifest=.next/server/middleware-manifest.json
          if [[ -f "$manifest" ]] && ! jq -e '((.middleware // {}) | length) == 0 and ((.functions // {}) | length) == 0' "$manifest" >/dev/null; then
            echo "::error title=static-export::Há middleware/proxy ou edge functions em ${manifest}."
            jq '{middleware: (.middleware | keys), functions: (.functions | keys)}' "$manifest"
            fail=1
          fi
          exit "$fail"

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Vulnerabilidades em dependências de produção
        run: pnpm audit --prod --audit-level low

      - name: Assinaturas do registry
        run: pnpm audit signatures

      # O Vercel CLI roda nos deploys com o VERCEL_TOKEN: a árvore inteira dele (devDependency do
      # projeto isolado) também precisa estar livre de vulnerabilidades conhecidas.
      - name: Vulnerabilidades no Vercel CLI isolado (tools/vercel-cli)
        working-directory: tools/vercel-cli
        run: pnpm audit --audit-level low

      # Idem para o Netlify CLI, que roda nos deploys da web com o NETLIFY_AUTH_TOKEN.
      - name: Vulnerabilidades no Netlify CLI isolado (tools/netlify-cli)
        working-directory: tools/netlify-cli
        run: pnpm audit --audit-level low

  python:
    name: python (tools/ingest)
    needs: scope
    # Em push roda sempre, pelo mesmo motivo do `test`: o Sonar precisa do coverage.xml.
    if: github.event_name == 'push' || fromJSON(needs.scope.outputs.json).ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/ingest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          working-directory: tools/ingest
          enable-cache: true

      - name: Sincronizar ambiente (uv.lock congelado)
        run: uv sync --frozen

      - name: ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: pyright
        run: uv run --frozen pyright

      - name: pytest
        run: uv run --frozen pytest --cov-report=xml:coverage.xml

      - name: Guardar o coverage.xml para o job sonar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: tools/ingest/coverage.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: pip-audit (lockfile, inclusive o extra docling)
        run: |
          requirements="${RUNNER_TEMP}/ingest-requirements.txt"
          uv export --frozen --no-dev --no-emit-project --all-extras --format requirements.txt \
            --output-file "${requirements}.raw" >/dev/null
          # Wheels do índice CPU do PyTorch têm versão local (torch==X+cpu), que não existe no PyPI e
          # não pode ser auditada pelo nome. A versão pública é o mesmo release, então é ela que
          # entra na consulta. O osv-scanner do security.yml audita o uv.lock como está.
          sed -E 's/^([A-Za-z0-9._-]+==[^ +;]+)\+[A-Za-z0-9.]+/\1/' "${requirements}.raw" >"$requirements"
          uv run --frozen pip-audit --strict --require-hashes --disable-pip -r "$requirements"

  # SonarQube Cloud em push para develop, só informativo (ADR 0032; em PR quem chama o sonar.yml é
  # o pr-gate.yml). Só develop: o plano gratuito analisa apenas a branch principal do projeto
  # (configurada lá como `develop`) e PRs; analisar `main` falha com "Organization is not allowed
  # to access data from non main branches". Espera test, integration e python para importar o lcov
  # dos unitários e da integração e o coverage.xml; não roda se um deles falhou.
  sonar:
    name: sonar
    needs: [scope, test, integration, python]
    if: >-
      ${{ !cancelled() && github.event_name == 'push' && github.ref == 'refs/heads/develop'
      && needs.scope.result == 'success'
      && contains(fromJSON('["success", "skipped"]'), needs.test.result)
      && contains(fromJSON('["success", "skipped"]'), needs.integration.result)
      && contains(fromJSON('["success", "skipped"]'), needs.python.result) }}
    uses: ./.github/workflows/sonar.yml
    permissions:
      contents: read
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
