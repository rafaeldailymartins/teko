# Gates de qualidade. Em PR, roda chamado pelo pr-gate.yml (que passa o escopo afetado em
# `inputs.affected`); em push para develop/main, recalcula o escopo sozinho.
#
# Ainda não estão aqui (entram nas fases que criam as ferramentas): Storybook (`vitest --project
# storybook`), `migration-guard` e as retrieval evals (se `rag`/`ingest` afetados).
name: CI

on:
  workflow_call:
    inputs:
      affected:
        description: >-
          JSON do job `affected` do pr-gate.yml
          ({web, api, shared, ingest, rag, llm, packages}). Vazio = recalcular aqui.
        type: string
        required: false
        default: ""
    secrets:
      SONAR_TOKEN:
        description: >-
          Token da SonarQube Cloud. Em PR do Dependabot vem dos segredos do Dependabot (o mantenedor
          cadastra o mesmo SONAR_TOKEN lá). Ausente em PR de fork: o job `sonar` termina verde sem
          analisar.
        required: false
  push:
    branches: [develop, main]

permissions: {}

concurrency:
  # Prefixo literal: num workflow chamado, `github.workflow` é o nome do chamador, e reaproveitá-lo
  # cancelaria o próprio pr-gate.
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  TURBO_TELEMETRY_DISABLED: "1"
  NEXT_TELEMETRY_DISABLED: "1"
  OPENSPEC_TELEMETRY: "0"
  # Base do `--affected` do turbo: a base do PR, ou o commit anterior do push. Um `before` nulo
  # (primeiro push do branch) não resolve, e o turbo então considera tudo afetado.
  TURBO_SCM_BASE: ${{ github.event_name == 'pull_request' && format('origin/{0}', github.base_ref) || github.event.before }}

jobs:
  scope:
    name: scope
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      json: ${{ steps.from-caller.outputs.json || steps.computed.outputs.json }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Usar o escopo recebido do pr-gate
        id: from-caller
        if: inputs.affected != ''
        env:
          AFFECTED: ${{ inputs.affected }}
        run: |
          jq -e 'has("packages") and has("ingest")' <<<"$AFFECTED" >/dev/null
          echo "json=$(jq -c . <<<"$AFFECTED")" >>"$GITHUB_OUTPUT"

      - name: Checkout (histórico completo)
        if: inputs.affected == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        if: inputs.affected == ''
        uses: ./.github/actions/setup

      - name: Calcular escopo afetado
        id: computed
        if: inputs.affected == ''
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_REF: ${{ github.base_ref }}
          BEFORE_SHA: ${{ github.event.before }}
        run: bash .github/scripts/affected.sh

  lint:
    name: lint
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Biome
        run: pnpm lint

      - name: Lockfiles em documento único (raiz, tools/vercel-cli e tools/netlify-cli)
        # O script verifica uma lista fixa: o lockfile da raiz e os dos projetos isolados dos CLIs de
        # deploy (lidos pelo Dependabot e pelos jobs de deploy), sem argumentos.
        run: pnpm check-lockfile

      - name: Consistência do monorepo (sherif)
        run: pnpm lint:monorepo

      - name: Código e dependências não usados (knip)
        run: pnpm knip

      - name: OpenSpec
        env:
          OPENSPEC_TELEMETRY: "0"
        run: pnpm spec:validate

      - name: Typecheck dos scripts da raiz
        run: pnpm typecheck:scripts

      # node:test nativo (Node 24): os scripts ficam fora dos pacotes, e o turbo boundaries proíbe
      # que um pacote importe arquivos de fora dele.
      - name: Testes dos scripts da raiz
        run: pnpm test:scripts

      - name: Duplicação (jscpd, 3%, min-tokens 70)
        run: pnpm dup

      - name: Fronteiras entre pacotes (turbo boundaries)
        # Sem tags, confere imports de arquivos fora do pacote e dependências não declaradas;
        # com as tags dos turbo.json dos pacotes, também as regras de `boundaries` da raiz.
        run: pnpm exec turbo boundaries

      - name: Testes do escopo afetado (affected.sh e grafo do turbo)
        run: bash .github/scripts/affected.test.sh

      - name: Testes da configuração de CI
        run: bash .github/scripts/ci-config.test.sh

      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "${RUNNER_TEMP}/${archive}" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  ${RUNNER_TEMP}/${archive}" | sha256sum --check --strict -
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" -color

  typecheck:
    name: typecheck
    needs: scope
    if: fromJSON(needs.scope.outputs.json).packages
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Typecheck (tsc 7), dependency-cruiser, steiger e type-coverage
        # A task `transit` do turbo.json põe os inputs do packages/shared no hash de api/web, então
        # uma mudança só no shared também roda os checks dos dependentes.
        run: pnpm exec turbo run typecheck lint:deps lint:fsd type-coverage --affected

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  test:
    name: test
    needs: scope
    if: fromJSON(needs.scope.outputs.json).packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov via OIDC, sem token no repositório
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Testes unitários com cobertura
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # PR: só os pacotes afetados (a análise de PR do Sonar e o patch do Codecov olham só o
          # código novo). Push: todos, para o Sonar receber a cobertura completa do branch; os
          # pacotes sem mudança saem do cache do Turbo, que restaura o coverage/ como output.
          if [[ "$EVENT_NAME" == push ]]; then
            pnpm exec turbo run test:unit
          else
            pnpm exec turbo run test:unit --affected
          fi

      - name: Guardar o lcov para o job sonar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-lcov
          # Dois caminhos: a raiz do artifact é o ancestral comum (a raiz do repo), então os
          # arquivos chegam ao sonar como apps/<app>/coverage/lcov.info e packages/<p>/...
          path: |
            apps/*/coverage/lcov.info
            packages/*/coverage/lcov.info
          if-no-files-found: ignore
          retention-days: 1

      - name: Enviar cobertura ao Codecov
        # PRs de fork não recebem token OIDC.
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          handle_no_reports_found: true
          exclude: node_modules,tools

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  integration:
    name: integration
    needs: scope
    if: fromJSON(needs.scope.outputs.json).api
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Testes de integração (Testcontainers no Docker do runner)
        run: pnpm exec turbo run test:integration --affected

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  build:
    name: build
    needs: scope
    if: fromJSON(needs.scope.outputs.json).packages
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout (histórico completo para o --affected)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        id: setup
        uses: ./.github/actions/setup
        with:
          turbo-cache: "true"

      - name: Build
        run: pnpm exec turbo run build --affected

      - name: Garantir o build do web (para o guard)
        # O --affected do turbo usa os inputs da task; isto garante o out/ quando o escopo diz que
        # o web foi afetado (cache hit se o passo anterior já o construiu).
        if: fromJSON(needs.scope.outputs.json).web
        run: pnpm exec turbo run build --filter=@teko/web

      - name: Guard do export estático (0 functions)
        if: fromJSON(needs.scope.outputs.json).web
        working-directory: apps/web
        run: |
          fail=0
          if [[ ! -f out/index.html ]]; then
            echo "::error title=static-export::apps/web/out/index.html não existe: o build não gerou export estático (output: 'export')."
            fail=1
          fi
          functions="$(find . -path ./node_modules -prune -o -type d \( -path '*/.netlify/functions*' -o -path '*/.netlify/edge-functions*' \) -print)"
          if [[ -n "$functions" ]]; then
            echo "::error title=static-export::O build gerou functions da Netlify:"
            echo "$functions"
            fail=1
          fi
          manifest=.next/server/middleware-manifest.json
          if [[ -f "$manifest" ]] && ! jq -e '((.middleware // {}) | length) == 0 and ((.functions // {}) | length) == 0' "$manifest" >/dev/null; then
            echo "::error title=static-export::Há middleware/proxy ou edge functions em ${manifest}."
            jq '{middleware: (.middleware | keys), functions: (.functions | keys)}' "$manifest"
            fail=1
          fi
          exit "$fail"

      - name: Salvar cache do Turbo
        if: github.event_name == 'push'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .turbo/cache
          key: ${{ steps.setup.outputs.turbo-cache-key }}

  audit:
    name: audit
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Vulnerabilidades em dependências de produção
        run: pnpm audit --prod --audit-level low

      - name: Assinaturas do registry
        run: pnpm audit signatures

      # O Vercel CLI roda nos deploys com o VERCEL_TOKEN: a árvore inteira dele (devDependency do
      # projeto isolado) também precisa estar livre de vulnerabilidades conhecidas.
      - name: Vulnerabilidades no Vercel CLI isolado (tools/vercel-cli)
        working-directory: tools/vercel-cli
        run: pnpm audit --audit-level low

      # Idem para o Netlify CLI, que roda nos deploys da web com o NETLIFY_AUTH_TOKEN.
      - name: Vulnerabilidades no Netlify CLI isolado (tools/netlify-cli)
        working-directory: tools/netlify-cli
        run: pnpm audit --audit-level low

  python:
    name: python (tools/ingest)
    needs: scope
    if: fromJSON(needs.scope.outputs.json).ingest
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write # Codecov via OIDC
    defaults:
      run:
        working-directory: tools/ingest
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Instalar uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: 0.13.7
          working-directory: tools/ingest
          enable-cache: true

      - name: Sincronizar ambiente (uv.lock congelado)
        run: uv sync --frozen

      - name: ruff
        run: |
          uv run --frozen ruff check .
          uv run --frozen ruff format --check .

      - name: pyright
        run: uv run --frozen pyright

      - name: pytest
        run: uv run --frozen pytest --cov-report=xml:coverage.xml

      - name: Guardar o coverage.xml para o job sonar
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-python
          path: tools/ingest/coverage.xml
          if-no-files-found: ignore
          retention-days: 1

      - name: pip-audit (lockfile, inclusive o extra docling)
        run: |
          requirements="${RUNNER_TEMP}/ingest-requirements.txt"
          uv export --frozen --no-dev --no-emit-project --all-extras --format requirements.txt \
            --output-file "${requirements}.raw" >/dev/null
          # Wheels do índice CPU do PyTorch têm versão local (torch==X+cpu), que não existe no PyPI e
          # não pode ser auditada pelo nome. A versão pública é o mesmo release, então é ela que
          # entra na consulta. O osv-scanner do security.yml audita o uv.lock como está.
          sed -E 's/^([A-Za-z0-9._-]+==[^ +;]+)\+[A-Za-z0-9.]+/\1/' "${requirements}.raw" >"$requirements"
          uv run --frozen pip-audit --strict --require-hashes --disable-pip -r "$requirements"

      - name: Enviar cobertura ao Codecov
        if: ${{ !cancelled() && github.event.pull_request.head.repo.fork != true }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          use_oidc: true
          fail_ci_if_error: true
          disable_search: true
          files: tools/ingest/coverage.xml
          flags: ingest

  # SonarQube Cloud (análise pelo CI; a automática fica desligada no projeto). O scanner espera o
  # quality gate (sonar.qualitygate.wait) e falha se ele reprovar, então o resultado do Sonar
  # chega aos rulesets pelo `ci-gate` do pr-gate.yml. O check "SonarQube Cloud Code Analysis" que o
  # App da SonarQube Cloud publica NÃO deve ser exigido nos rulesets: ele nunca aparece em PR de
  # fork (sem segredos) e, sem o SONAR_TOKEN nos segredos do Dependabot, nem nos do Dependabot.
  # Escopo, exclusões e caminhos de cobertura ficam em sonar-project.properties. Espera test e
  # python para importar o lcov e o coverage.xml.
  sonar:
    name: sonar
    needs: [scope, test, python]
    # Roda também quando test/python foram pulados (escopo sem pacote JS ou sem ingest), para que
    # todo PR receba o check do Sonar; não roda se um deles falhou ou foi cancelado.
    # Em push, só em develop: o plano gratuito do SonarQube Cloud analisa apenas a branch principal
    # do projeto (configurada lá como `develop`) e PRs; analisar `main` falha com "Organization is
    # not allowed to access data from non main branches".
    if: >-
      ${{ !cancelled() && needs.scope.result == 'success'
      && (github.event_name != 'push' || github.ref == 'refs/heads/develop')
      && contains(fromJSON('["success", "skipped"]'), needs.test.result)
      && contains(fromJSON('["success", "skipped"]'), needs.python.result) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Conferir token e variáveis do Sonar
        id: preflight
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_ORGANIZATION: ${{ vars.SONAR_ORGANIZATION }}
          SONAR_PROJECT_KEY: ${{ vars.SONAR_PROJECT_KEY }}
        run: |
          # PRs de fork não recebem segredos; os do Dependabot só recebem os segredos do
          # Dependabot (SONAR_TOKEN precisa estar cadastrado lá também). Sem token, pula sem falhar.
          if [[ -z "${SONAR_TOKEN}" ]]; then
            echo "::notice title=sonar::SONAR_TOKEN indisponível neste evento (fork, ou Dependabot sem o segredo do Dependabot); análise do SonarQube Cloud pulada."
            echo "run=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${SONAR_ORGANIZATION}" || -z "${SONAR_PROJECT_KEY}" ]]; then
            echo "::error title=sonar::Defina as variáveis de repositório SONAR_ORGANIZATION e SONAR_PROJECT_KEY."
            exit 1
          fi
          echo "run=true" >>"$GITHUB_OUTPUT"

      - name: Checkout (histórico completo para blame e código novo)
        if: steps.preflight.outputs.run == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup
        # As dependências instaladas dão ao analisador de TypeScript os tipos reais dos pacotes.
        if: steps.preflight.outputs.run == 'true'
        uses: ./.github/actions/setup

      - name: Baixar o lcov dos testes unitários
        if: steps.preflight.outputs.run == 'true' && needs.test.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-lcov
          path: ${{ github.workspace }}
          merge-multiple: true

      - name: Baixar o coverage.xml do tools/ingest
        if: steps.preflight.outputs.run == 'true' && needs.python.result == 'success'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: coverage-python
          path: ${{ github.workspace }}/tools/ingest
          merge-multiple: true

      - name: Caminhos do lcov a partir da raiz do repositório
        if: steps.preflight.outputs.run == 'true'
        run: |
          # O Vitest grava `SF:src/...` relativo ao pacote; o Sonar resolve caminhos relativos
          # contra a raiz do projeto. Caminhos absolutos ficam como estão.
          shopt -s nullglob
          for lcov in apps/*/coverage/lcov.info packages/*/coverage/lcov.info; do
            pkg="${lcov%/coverage/lcov.info}"
            sed -i -E "\#^SF:${pkg}/#! s#^SF:([^/])#SF:${pkg}/\1#" "$lcov"
            echo "${lcov}: $(grep -c '^SF:' "$lcov") arquivo(s)"
          done

      - name: Análise SonarQube Cloud (falha se o quality gate reprovar)
        if: steps.preflight.outputs.run == 'true'
        uses: SonarSource/sonarqube-scan-action@e805d875275f728fac1885b413934be6d7c63f65 # v8.4.1
        timeout-minutes: 10
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >-
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=300
