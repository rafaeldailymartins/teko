# Spike F1 (b): Fastify "hello" com o server.ts real no projeto `teko-api-staging`, pelo mesmo
# fluxo que o deploy-api.yml da F7 vai usar:
#   tsdown → pnpm deploy --prod → scripts/build-vercel-output.ts (Build Output API v3) → tarball
#   do .vercel/output atestado (actions/attest) → gh attestation verify → vercel deploy --prebuilt
#   --prod --skip-domain → vercel curl na URL única (protegida) → vercel promote.
#
# Não há `vercel pull` nem `vercel build`: o builder zero-config do Fastify mantinha os imports
# `.ts` no server.js e a Function caía com ERR_MODULE_NOT_FOUND (run 42980171686). O output é
# montado a partir do bundle do tsdown (ADR 0017), e o deploy só precisa de VERCEL_ORG_ID e
# VERCEL_PROJECT_ID.
#
# Só `workflow_dispatch` (nunca roda em PR nem em push) e só no environment `staging`, que guarda
# o VERCEL_TOKEN de staging (segredo) e VERCEL_ORG_ID/VERCEL_PROJECT_ID (variáveis). Sem eles o
# job falha logo no primeiro passo, com a lista do que falta. Nada aqui inventa resultado: o
# resumo do job registra o que a Vercel gerou (functions, runtime, região, URL, sha256), e as
# verificações manuais do spike (SSE de 95 s, desconexão, SIGTERM, promote durante stream, cold
# start, rollback) seguem o roteiro em docs/adr, usando a deployment criada aqui.
#
# O Vercel CLI vem do projeto isolado tools/vercel-cli (lockfile próprio; ver ADR 0002).
name: Spike F1 (b) - API na Vercel

on:
  workflow_dispatch:
    inputs:
      promote:
        description: Promover a deployment ao domínio de produção do teko-api-staging (vercel promote)
        type: boolean
        default: true
      stream_checks:
        description: "Depois do promote: SSE de 95 s, desconexão, waitUntil, promote durante stream e logs (cerca de 8 min)"
        type: boolean
        default: false

permissions: {}

concurrency:
  # Deploys nunca são cancelados no meio.
  group: spike-api-vercel
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (teko-api-staging)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
      id-token: write # assinatura Sigstore da atestação
      attestations: write # grava a atestação do tarball no repositório
    env:
      VERCEL_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # audit: os hosts da Vercel observados aqui alimentam a allowlist do deploy-api.yml.
          egress-policy: audit

      - name: Conferir segredos e variáveis do environment staging
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        run: |
          missing=()
          [[ -n "${VERCEL_TOKEN}" ]] || missing+=("segredo VERCEL_TOKEN")
          [[ -n "${VERCEL_AUTOMATION_BYPASS_SECRET}" ]] || missing+=("segredo VERCEL_AUTOMATION_BYPASS_SECRET (Protection Bypass for Automation do projeto)")
          [[ -n "${VERCEL_ORG_ID}" ]] || missing+=("variável VERCEL_ORG_ID")
          [[ -n "${VERCEL_PROJECT_ID}" ]] || missing+=("variável VERCEL_PROJECT_ID (do projeto teko-api-staging)")
          if (( ${#missing[@]} > 0 )); then
            printf -v list '%s, ' "${missing[@]}"
            echo "::error title=spike-api-vercel::Faltam no environment 'staging': ${list%, }. Cadastre-os (Settings > Environments > staging) e rode de novo; nada foi construído nem publicado."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Instalar o Vercel CLI (tools/vercel-cli, lockfile congelado)
        run: |
          pnpm --dir tools/vercel-cli install --frozen-lockfile
          echo "${GITHUB_WORKSPACE}/tools/vercel-cli/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Bundle da API (tsdown)
        run: pnpm --filter @teko/api build

      - name: Dependências de produção da API (pnpm deploy, linker hoisted)
        # hoisted: node_modules sem links simbólicos (o script recusa link e descarta os .bin).
        run: >-
          pnpm --filter @teko/api --prod deploy --ignore-scripts
          --config.node-linker=hoisted dist/vercel/api-prod

      - name: Montar o .vercel/output (Build Output API v3)
        run: |
          vercel --version
          node scripts/build-vercel-output.ts

      - name: Empacotar o .vercel/output (sem .env nem project.json)
        id: pack
        run: |
          out=.vercel/output
          if [[ ! -f "$out/config.json" ]]; then
            echo "::error title=spike-api-vercel::scripts/build-vercel-output.ts não gerou $out/config.json."
            exit 1
          fi
          tarball="${RUNNER_TEMP}/teko-api-vercel-output.tgz"
          # Só o diretório output entra; .vercel/.env* e .vercel/project.json ficam de fora.
          tar --sort=name --owner=0 --group=0 --numeric-owner --mtime='@0' \
            -C "$(dirname "$out")" -czf "$tarball" output
          sha256="$(sha256sum "$tarball" | cut -d' ' -f1)"
          {
            echo "out=${out}"
            echo "tarball=${tarball}"
            echo "sha256=${sha256}"
          } >>"$GITHUB_OUTPUT"
          {
            echo "## Spike F1 (b): build"
            echo
            echo "- output: \`${out}\`"
            echo "- tarball sha256: \`${sha256}\`"
            echo "- functions:"
            find "$out/functions" -maxdepth 3 -name '.vc-config.json' -print0 2>/dev/null \
              | while IFS= read -r -d '' cfg; do
                  echo "  - \`${cfg#"$out"/}\`: $(jq -c '{runtime, handler, launcherType, regions, maxDuration, supportsResponseStreaming, supportsCancellation}' "$cfg")"
                done
            echo "- tamanho da Function: $(du -sh "$out/functions" | cut -f1)"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Atestar o tarball (provenance)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ steps.pack.outputs.tarball }}

      - name: Verificar a atestação antes do deploy
        env:
          GH_TOKEN: ${{ github.token }}
          TARBALL: ${{ steps.pack.outputs.tarball }}
          REPO: ${{ github.repository }}
        run: gh attestation verify "$TARBALL" --repo "$REPO"

      - name: vercel deploy --prebuilt --prod --skip-domain
        id: deploy
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          ARTIFACT_SHA256: ${{ steps.pack.outputs.sha256 }}
          GIT_SHA: ${{ github.sha }}
        run: |
          url="$(vercel deploy --prebuilt --prod --skip-domain \
            --meta "artifactSha256=${ARTIFACT_SHA256}" --meta "gitSha=${GIT_SHA}" \
            --token "${VERCEL_TOKEN}")"
          if [[ ! "$url" =~ ^https://[a-z0-9.-]+\.vercel\.app$ ]]; then
            echo "::error title=spike-api-vercel::Saída inesperada do vercel deploy: ${url}"
            exit 1
          fi
          echo "url=${url}" >>"$GITHUB_OUTPUT"
          echo "- deployment: ${url} (meta artifactSha256=${ARTIFACT_SHA256})" >>"$GITHUB_STEP_SUMMARY"
          # Diagnóstico (região e Functions como a Vercel registrou); não decide o resultado.
          vercel inspect "$url" --token "${VERCEL_TOKEN}" || echo "::warning::vercel inspect falhou"

      - name: Smoke na URL única (protegida) com vercel curl
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
          BYPASS: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
        # Sem `--token`: o `vercel curl` repassa ao curl todos os argumentos que não são dele (até os
        # globais antes do subcomando), então o token vem do env VERCEL_TOKEN, que o CLI lê. O bypass
        # é sempre o do environment; sem ele, o CLI gera um segredo novo no projeto.
        run: |
          for path in /healthz /api/healthz; do
            vercel curl "$path" --deployment "$DEPLOYMENT_URL" \
              --protection-bypass "${BYPASS}" -- --fail-with-body --include
          done

      - name: URL única sem bypass não chega à API
        env:
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          # Deployment Protection Standard: a URL única exige login na Vercel (401 ou redirect).
          status="$(curl -sS -o /dev/null -w '%{http_code}' "${DEPLOYMENT_URL}/healthz")"
          echo "- URL única sem bypass: HTTP ${status}" >>"$GITHUB_STEP_SUMMARY"
          if [[ "$status" == 200 ]]; then
            echo "::error title=spike-api-vercel::A URL única respondeu 200 sem autenticação; confira a Deployment Protection (Standard)."
            exit 1
          fi

      - name: vercel promote
        if: inputs.promote
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          vercel promote "$DEPLOYMENT_URL" --timeout=5m --token "${VERCEL_TOKEN}"
          echo "- promovida: ${DEPLOYMENT_URL}" >>"$GITHUB_STEP_SUMMARY"
          # O domínio de produção precisa ser público (proxy da Netlify, stream e preflight CORS
          # chegam sem login): curl puro, sem o bypass.
          vercel api "/v9/projects/${VERCEL_PROJECT_ID}/domains" >"${RUNNER_TEMP}/domains.json"
          mapfile -t domains < <(jq -r '.domains[].name' "${RUNNER_TEMP}/domains.json")
          if (( ${#domains[@]} == 0 )); then
            echo "::error title=spike-api-vercel::O projeto não tem domínio de produção."
            exit 1
          fi
          for domain in "${domains[@]}"; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "https://${domain}/healthz")"
            echo "  - https://${domain}/healthz sem bypass: HTTP ${status}" >>"$GITHUB_STEP_SUMMARY"
            if [[ "$status" != 200 ]]; then
              echo "::error title=spike-api-vercel::https://${domain}/healthz respondeu ${status} sem bypass; o domínio de produção precisa ser público."
              exit 1
            fi
          done

      # --- Verificações de stream do spike F1 (b), contra o domínio de produção do staging -------
      # Usam as rotas temporárias /api/_spike/* (só existem em staging na Vercel). As de SSE e de
      # promote durante stream decidem o resultado; as de desconexão, waitUntil e SIGTERM só
      # registram o que os logs de runtime mostram (é isso que o spike quer descobrir).

      - name: "Spike: runtime e waitUntil"
        if: inputs.promote && inputs.stream_checks
        run: |
          base=https://teko-api-staging.vercel.app
          curl -sS --fail-with-body "${base}/api/_spike/runtime" >"${RUNNER_TEMP}/runtime.json"
          jq -c . "${RUNNER_TEMP}/runtime.json"
          curl -sS --fail-with-body -X POST "${base}/api/_spike/wait-until?delayMs=1500" >"${RUNNER_TEMP}/wait-until.json"
          {
            echo "## Spike F1 (b): stream e runtime"
            echo
            echo "- runtime: \`$(jq -c . "${RUNNER_TEMP}/runtime.json")\`"
            echo "- waitUntil agendado: \`$(jq -c . "${RUNNER_TEMP}/wait-until.json")\`"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: "Spike: SSE de 95 s e promote de uma deployment antiga durante o stream"
        if: inputs.promote && inputs.stream_checks
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          base=https://teko-api-staging.vercel.app
          sse="${RUNNER_TEMP}/sse.txt"
          # Cada linha do stream sai com o instante de chegada (ms desde o início do curl).
          probe() {
            local url="$1" out="$2" max="$3" start
            start="$(date +%s%3N)"
            curl -sSN --max-time "$max" -D "${out}.headers" "$url" 2>"${out}.err" \
              | while IFS= read -r line || [[ -n "$line" ]]; do
                  printf '%s %s\n' "$(( $(date +%s%3N) - start ))" "$line"
                done >"$out"
          }

          # Deployment de produção anterior (para o promote durante o stream e a volta).
          vercel api "/v6/deployments?projectId=${VERCEL_PROJECT_ID}&target=production&state=READY&limit=10" >"${RUNNER_TEMP}/deployments.json"
          current="${DEPLOYMENT_URL#https://}"
          previous="$(jq -r --arg current "$current" '[.deployments[] | select(.url != $current)] | sort_by(.created) | reverse | .[0].url // empty' "${RUNNER_TEMP}/deployments.json")"
          if [[ -z "$previous" ]]; then
            echo "::error title=spike-api-vercel::Não há deployment de produção anterior para o promote durante o stream."
            exit 1
          fi

          probe "${base}/api/_spike/sse?firstByteDelayS=30&durationS=95&heartbeatS=15" "$sse" 130 &
          stream_pid=$!
          sleep 40
          # Durante o stream: o domínio passa para a deployment anterior (promote de deployment
          # de produção mais antiga no Hobby); o stream em curso deve terminar na atual.
          promote_rc=0
          vercel promote "https://${previous}" --timeout=5m || promote_rc=$?
          older_health="$(curl -sS -o /dev/null -w '%{http_code}' "${base}/healthz" || true)"
          wait "$stream_pid" || true
          # Volta: o domínio de produção fica de novo com a deployment desta execução.
          vercel promote "$DEPLOYMENT_URL" --timeout=5m
          back_health="$(curl -sS -o /dev/null -w '%{http_code}' "${base}/healthz")"

          cat "$sse"
          fail=0
          start_ms="$(awk '$2 == "event:" && $3 == "start" {print $1; exit}' "$sse")"
          end_ms="$(awk '$2 == "event:" && $3 == "end" {print $1; exit}' "$sse")"
          hb_count="$(grep -c ' : hb ' "$sse" || true)"
          # Maior intervalo entre linhas não vazias depois do start (buffering juntaria tudo no fim).
          max_gap="$(awk -v s="${start_ms:-0}" 'NF > 1 && $1 >= s { if (prev != "") { gap = $1 - prev; if (gap > max) max = gap } prev = $1 } END { print max + 0 }' "$sse")"
          {
            echo "- SSE pelo domínio de produção: start em \`${start_ms:-ausente}\` ms, end em \`${end_ms:-ausente}\` ms, heartbeats \`${hb_count}\`, maior intervalo \`${max_gap}\` ms"
            echo "- headers do SSE: \`$(grep -iE '^(content-type|cache-control|x-vercel-id):' "${sse}.headers" | tr -d '\r' | paste -sd ';' -)\`"
            echo "- promote da deployment anterior (\`${previous}\`) durante o stream: código \`${promote_rc}\`; /healthz depois: HTTP \`${older_health}\`; volta para a atual: HTTP \`${back_health}\`"
          } >>"$GITHUB_STEP_SUMMARY"
          if [[ -z "$start_ms" ]] || (( start_ms < 29000 || start_ms > 45000 )); then
            echo "::error title=spike-api-vercel::O primeiro evento do SSE não chegou entre 29 e 45 s (${start_ms:-ausente} ms)."
            fail=1
          fi
          if [[ -z "$end_ms" ]] || (( end_ms < 94000 )); then
            echo "::error title=spike-api-vercel::O SSE não terminou com event: end depois de 95 s (${end_ms:-ausente} ms); corte ou promote derrubaram o stream."
            fail=1
          fi
          if (( hb_count < 4 || max_gap > 17000 )); then
            echo "::error title=spike-api-vercel::Heartbeats ausentes ou chegando em bloco (${hb_count} heartbeats, maior intervalo ${max_gap} ms): buffering."
            fail=1
          fi
          if (( promote_rc != 0 )); then
            echo "::error title=spike-api-vercel::vercel promote de uma deployment de produção anterior falhou (${promote_rc})."
            fail=1
          fi
          [[ "$back_health" == 200 ]] || fail=1
          exit "$fail"

      - name: "Spike: desconexão, waitUntil e SIGTERM nos logs de runtime"
        if: always() && inputs.promote && inputs.stream_checks && steps.deploy.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        run: |
          base=https://teko-api-staging.vercel.app
          # Depois do promote de volta, o domínio leva um instante para servir a deployment desta
          # execução (no primeiro dispatch, o teste caiu na anterior, sem as rotas de spike: 404).
          # Espera até 60 s pela rota de runtime antes de testar.
          for _ in $(seq 1 30); do
            [[ "$(curl -sS -o /dev/null -w '%{http_code}' "${base}/api/_spike/runtime")" == 200 ]] && break
            sleep 2
          done
          # O cliente desiste aos 15 s de um stream de 60 s.
          curl -sSN --max-time 15 "${base}/api/_spike/sse?firstByteDelayS=5&durationS=60&heartbeatS=5" >/dev/null 2>&1 || true
          sleep 30
          vercel logs --deployment "$DEPLOYMENT_URL" --since 30m --json >"${RUNNER_TEMP}/deploy-logs.jsonl" 2>/dev/null || true
          vercel logs --since 30m --json >"${RUNNER_TEMP}/project-logs.jsonl" 2>/dev/null || true
          report() {
            local label="$1" pattern="$2" file="$3" lines
            lines="$(grep -a "$pattern" "$file" | cut -c1-400 || true)"
            echo "- ${label}: $(grep -ac "$pattern" "$file" || true) registro(s)"
            if [[ -n "$lines" ]]; then
              echo '```'
              echo "$lines" | head -5
              echo '```'
            fi
          }
          {
            report "desconexão via request.signal" 'cliente desconectou' "${RUNNER_TEMP}/deploy-logs.jsonl"
            report "resposta fechada antes do fim" 'resposta fechada antes do fim' "${RUNNER_TEMP}/deploy-logs.jsonl"
            report "waitUntil concluído depois da resposta" 'tarefa pós-resposta concluída' "${RUNNER_TEMP}/deploy-logs.jsonl"
            report "SIGTERM (shutdown requested) no projeto, últimos 30 min" 'shutdown requested' "${RUNNER_TEMP}/project-logs.jsonl"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Logs de runtime da deployment (só em falha)
        if: failure() && steps.deploy.outputs.url != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
          DEPLOYMENT_URL: ${{ steps.deploy.outputs.url }}
        # As mensagens da API nunca trazem valores de env (env.ts); o boot recusado aparece aqui.
        run: vercel logs --deployment "$DEPLOYMENT_URL" --since 30m --json --token "${VERCEL_TOKEN}"
