# Spike F1 (a): export estático do Next no site `teko-web` da Netlify, pelo mesmo fluxo que o
# deploy-web.yml da F7 vai usar:
#   netlify deploy --build --context develop --alias develop (build no runner; o
#   @netlify/plugin-nextjs vem do lockfile e se desliga com NETLIFY_NEXT_PLUGIN_SKIP) → 0 functions
#   e 0 edge functions no deploy → env do contexto develop aplicado no build →
#   https://develop--teko-web.netlify.app servindo o export.
#
# Só `workflow_dispatch` (nunca roda em PR nem em push) e só no environment `staging`, que guarda o
# NETLIFY_AUTH_TOKEN (segredo). O site é achado pelo nome (`teko-web`); sem token ou sem site, o job
# falha antes de construir. Nada aqui inventa resultado: o resumo do job registra o que a Netlify
# devolveu (deploy, URL, functions, contexto).
#
# O Netlify CLI vem do projeto isolado tools/netlify-cli (lockfile próprio; ver ADR 0002).
name: Spike F1 (a) - web na Netlify

on:
  workflow_dispatch:

permissions: {}

concurrency:
  # Deploys nunca são cancelados no meio.
  group: spike-web-netlify
  cancel-in-progress: false

jobs:
  deploy:
    name: deploy (teko-web, alias develop)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: staging
    permissions:
      contents: read
    env:
      NETLIFY_SITE_NAME: teko-web
      EXPECTED_STREAM_ORIGIN: https://teko-api-staging.vercel.app
      NETLIFY_TELEMETRY_DISABLED: "1"
      TURBO_TELEMETRY_DISABLED: "1"
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          # audit: os hosts da Netlify observados aqui alimentam a allowlist do deploy-web.yml.
          egress-policy: audit

      - name: Conferir o segredo do environment staging
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          if [[ -z "${NETLIFY_AUTH_TOKEN}" ]]; then
            echo "::error title=spike-web-netlify::Falta o segredo NETLIFY_AUTH_TOKEN no environment 'staging'; nada foi construído nem publicado."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup
        uses: ./.github/actions/setup

      - name: Instalar o Netlify CLI (tools/netlify-cli, lockfile congelado)
        run: |
          pnpm --dir tools/netlify-cli install --frozen-lockfile
          echo "${GITHUB_WORKSPACE}/tools/netlify-cli/node_modules/.bin" >>"$GITHUB_PATH"

      - name: Achar o site teko-web
        id: site
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
        run: |
          netlify --version
          netlify api listSites --data "{\"name\":\"${NETLIFY_SITE_NAME}\",\"filter\":\"all\"}" >"${RUNNER_TEMP}/sites.json"
          mapfile -t ids < <(jq -r --arg name "$NETLIFY_SITE_NAME" '.[] | select(.name == $name) | .id' "${RUNNER_TEMP}/sites.json")
          if (( ${#ids[@]} != 1 )); then
            echo "::error title=spike-web-netlify::Esperado exatamente 1 site chamado ${NETLIFY_SITE_NAME}; achados: ${#ids[@]}."
            exit 1
          fi
          echo "id=${ids[0]}" >>"$GITHUB_OUTPUT"
          {
            echo "## Spike F1 (a): web na Netlify"
            echo
            echo "- site: \`${NETLIFY_SITE_NAME}\` (\`${ids[0]}\`)"
            jq -r --arg name "$NETLIFY_SITE_NAME" '.[] | select(.name == $name) | "- build settings: base `\(.build_settings.base // "")`, package `\(.build_settings.package_path // "")`, stop_builds `\(.build_settings.stop_builds // "")`"' "${RUNNER_TEMP}/sites.json"
          } >>"$GITHUB_STEP_SUMMARY"

      - name: netlify deploy --build --context develop --alias develop
        id: deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ steps.site.outputs.id }}
        run: |
          log="${RUNNER_TEMP}/deploy.log"
          # O log do build vai para o stderr; o JSON do deploy, para o stdout. O log é gravado
          # inteiro antes de ser lido e aparece no job com sucesso ou falha.
          rc=0
          netlify deploy --build --context develop --alias develop --filter @teko/web --json \
            >"${RUNNER_TEMP}/deploy.json" 2>"$log" || rc=$?
          cat "$log" >&2
          if (( rc != 0 )); then
            echo "::error title=spike-web-netlify::netlify deploy terminou com código ${rc}."
            exit "$rc"
          fi
          jq '{site_id, deploy_id, deploy_url}' "${RUNNER_TEMP}/deploy.json"
          deploy_id="$(jq -r '.deploy_id' "${RUNNER_TEMP}/deploy.json")"
          deploy_url="$(jq -r '.deploy_url' "${RUNNER_TEMP}/deploy.json")"
          echo "id=${deploy_id}" >>"$GITHUB_OUTPUT"
          echo "url=${deploy_url}" >>"$GITHUB_OUTPUT"
          echo "- deploy: \`${deploy_id}\` em ${deploy_url}" >>"$GITHUB_STEP_SUMMARY"

          fail=0
          # Env do contexto: o next.config.ts registra o contexto e a origem do stream do build.
          probe="$(grep -aoE '\[teko\] contexto Netlify=[^ ]+ NEXT_PUBLIC_STREAM_ORIGIN=[^ ]*' "$log" | tail -1 || true)"
          echo "- build: \`${probe:-linha [teko] ausente}\`" >>"$GITHUB_STEP_SUMMARY"
          if [[ "$probe" != "[teko] contexto Netlify=develop NEXT_PUBLIC_STREAM_ORIGIN=${EXPECTED_STREAM_ORIGIN}" ]]; then
            echo "::error title=spike-web-netlify::O build não rodou no contexto develop com NEXT_PUBLIC_STREAM_ORIGIN=${EXPECTED_STREAM_ORIGIN} (linha: ${probe:-ausente})."
            fail=1
          fi
          # Sem adapter: o @netlify/plugin-nextjs vem do lockfile (devDependency do @teko/web, em
          # [[plugins]]), nunca de uma instalação automática sem versão fixa, e só se desliga.
          if [[ -d apps/web/.netlify/plugins/node_modules ]]; then
            echo "::error title=spike-web-netlify::A Netlify instalou plugins por conta própria em apps/web/.netlify/plugins:"
            ls apps/web/.netlify/plugins/node_modules
            fail=1
          fi
          if ! grep -aq 'Skipping Next.js plugin due to NETLIFY_NEXT_PLUGIN_SKIP' "$log"; then
            echo "::error title=spike-web-netlify::O @netlify/plugin-nextjs não confirmou o skip; NETLIFY_NEXT_PLUGIN_SKIP não funcionou."
            fail=1
          fi
          exit "$fail"

      - name: 0 functions e 0 edge functions no deploy
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DEPLOY_ID: ${{ steps.deploy.outputs.id }}
        run: |
          netlify api getDeploy --data "{\"deploy_id\":\"${DEPLOY_ID}\"}" >"${RUNNER_TEMP}/deploy-api.json"
          summary="$(jq -c '{state, context, branch, framework, functions: ((.available_functions // []) | length), edge_functions_present, function_schedules: ((.function_schedules // []) | length)}' "${RUNNER_TEMP}/deploy-api.json")"
          echo "$summary"
          echo "- getDeploy: \`${summary}\`" >>"$GITHUB_STEP_SUMMARY"
          if ! jq -e '((.available_functions // []) | length) == 0 and (.edge_functions_present // false) == false' "${RUNNER_TEMP}/deploy-api.json" >/dev/null; then
            echo "::error title=spike-web-netlify::O deploy tem functions ou edge functions; o web precisa ser só estático."
            exit 1
          fi

      - name: O alias develop serve o export
        env:
          DEPLOY_URL: ${{ steps.deploy.outputs.url }}
        run: |
          fail=0
          for path in / /pt-BR/; do
            status="$(curl -sS -o /dev/null -w '%{http_code}' "${DEPLOY_URL}${path}")"
            echo "- ${DEPLOY_URL}${path}: HTTP ${status}" >>"$GITHUB_STEP_SUMMARY"
            [[ "$status" =~ ^(200|301|302|308)$ ]] || fail=1
          done
          # Headers do netlify.toml aplicados.
          headers="$(curl -sS -D - -o /dev/null "${DEPLOY_URL}/pt-BR/")"
          for header in strict-transport-security x-content-type-options content-security-policy; do
            if ! grep -qi "^${header}:" <<<"$headers"; then
              echo "::error title=spike-web-netlify::Falta o header ${header} em ${DEPLOY_URL}/pt-BR/."
              fail=1
            fi
          done
          # Diagnóstico do proxy assinado /api/* → teko-api-staging (spike c); não decide o resultado.
          proxy="$(curl -sS -o /dev/null -w '%{http_code}' "${DEPLOY_URL}/api/healthz" || true)"
          echo "- ${DEPLOY_URL}/api/healthz (proxy, spike c): HTTP ${proxy}" >>"$GITHUB_STEP_SUMMARY"
          if (( fail )); then
            echo "::error title=spike-web-netlify::O alias develop não serve o export como esperado (ver o resumo)."
          fi
          exit "$fail"
