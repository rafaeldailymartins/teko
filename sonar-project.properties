# SonarQube Cloud: análise pelo CI (job `sonar` do .github/workflows/ci.yml). A análise automática
# fica DESLIGADA no projeto; as duas não podem coexistir.
#
# Organização e chave do projeto NÃO ficam aqui: o CI as passa a partir das variáveis do
# repositório SONAR_ORGANIZATION (rafaeldailymartins) e SONAR_PROJECT_KEY
# (rafaeldailymartins_teko). Para uma análise local, passe -Dsonar.organization e
# -Dsonar.projectKey na linha de comando do scanner.
#
# O quality gate é o "Sonar way". O job `sonar` espera o resultado (sonar.qualitygate.wait, passado
# pelo CI) e falha se ele reprovar; é assim que o Sonar entra no check obrigatório `ci-gate`. O
# check "SonarQube Cloud Code Analysis" do App da SonarQube Cloud fica fora dos rulesets (não
# aparece em PR de fork). Ver CONTRIBUTING.md, "Quality gates".

sonar.projectName=Tekó
sonar.sourceEncoding=UTF-8

# --- Escopo --------------------------------------------------------------------------------------
# sonar.sources/sonar.tests aceitam só diretórios (sem curinga). Os testes TypeScript ficam ao lado
# do código (`*.test.ts`), então os mesmos diretórios entram nos dois e as inclusões/exclusões
# separam o que é teste. Fora do escopo por não estarem listados: tools/vercel-cli e
# tools/netlify-cli (só os lockfiles dos CLIs de deploy), openspec/, docs/, infra/, .claude/, .github/ e .semgrep/ (fixtures de regras).
sonar.sources=apps/api,apps/web,packages/shared,scripts,tools/ingest/src
sonar.tests=apps/api,apps/web,packages/shared,tools/ingest/tests

sonar.test.inclusions=\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/api/test/**,\
  apps/web/tests/**,\
  packages/shared/test/**,\
  tools/ingest/tests/**

# Gerados, artefatos de build/teste e dependências, mais os próprios testes (que entram por
# sonar.tests). O export do Next fica ancorado em apps/web/out: um `**/out/**` também tiraria da
# análise os adapters de saída da API (apps/api/src/adapters/out), o mesmo bug já corrigido no
# .gitignore (ADR 0002).
sonar.exclusions=\
  **/node_modules/**,\
  **/dist/**,\
  apps/web/out/**,\
  **/.next/**,\
  **/.turbo/**,\
  **/.vercel/**,\
  **/.netlify/**,\
  **/coverage/**,\
  **/coverage-integration/**,\
  **/reports/**,\
  **/.stryker-tmp/**,\
  **/__generated__/**,\
  **/drizzle/migrations/**,\
  **/next-env.d.ts,\
  **/*.tsbuildinfo,\
  **/.venv/**,\
  **/__pycache__/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/api/test/**,\
  apps/web/tests/**,\
  packages/shared/test/**

# --- Cobertura -----------------------------------------------------------------------------------
# lcov do Vitest (v8) por pacote, mais o da integração da API (a persistência e a CLI só rodam
# contra o Postgres; o Sonar soma os dois relatórios). O Vitest grava `SF:` relativo ao pacote (`src/...`); o job
# `sonar` reescreve para o caminho a partir da raiz (`apps/api/src/...`) antes da análise, porque
# o Sonar resolve caminhos relativos do lcov contra a raiz do projeto.
sonar.javascript.lcov.reportPaths=\
  apps/api/coverage/lcov.info,\
  apps/api/coverage-integration/lcov.info,\
  apps/web/coverage/lcov.info,\
  packages/shared/coverage/lcov.info

# coverage.xml do pytest-cov (tools/ingest), quando o job python roda.
sonar.python.coverage.reportPaths=tools/ingest/coverage.xml
sonar.python.version=3.12

# Fora da cobertura: o mesmo que os `coverage.exclude` dos vitest.config.ts (entrypoints, rotas do
# Next que só reexportam, componentes de servidor do build, stories, barrels), mais arquivos de
# configuração e scripts da raiz, que não têm teste unitário por desenho.
sonar.coverage.exclusions=\
  apps/api/src/server.ts,\
  apps/api/src/vercel.ts,\
  apps/web/app/**,\
  apps/web/src/app/entrypoint/**,\
  apps/web/src/pages/**/ui/**,\
  apps/web/src/widgets/**/ui/**,\
  apps/web/src/shared/i18n/request.ts,\
  apps/web/src/**/index.ts,\
  apps/web/netlify/**,\
  **/*.stories.tsx,\
  **/*.d.ts,\
  **/*.config.ts,\
  **/*.config.mts,\
  **/*.config.mjs,\
  **/*.config.js,\
  **/*.config.cjs,\
  apps/api/evals/**,\
  apps/api/perf/**,\
  scripts/**

# Duplicação: o jscpd já é gate próprio (3%, min-tokens 70); aqui só os testes ficam de fora.
sonar.cpd.exclusions=\
  **/*.test.ts,\
  **/*.test.tsx

# --- TypeScript ----------------------------------------------------------------------------------
# Lista explícita evita a varredura do repositório inteiro atrás de tsconfig.
sonar.typescript.tsconfigPaths=\
  apps/api/tsconfig.json,\
  apps/web/tsconfig.json,\
  packages/shared/tsconfig.json,\
  tsconfig.scripts.json
