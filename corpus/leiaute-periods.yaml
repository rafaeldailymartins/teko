# Períodos de leiaute, curados à mão (plano, "Regras de vigência", item 1). Schema:
# apps/api/src/adapters/in/cli/ingest/sources.ts (`leiautePeriodsFileSchema`).
#
# Cada período é meio-aberto: `from` inclusivo, `to` exclusivo (`null` = em aberto). As datas
# "de 01/01/2025 a 31/12/2025" das fontes viram `from: 2025-01-01, to: 2026-01-01`. As fontes de
# corpus/sources.yaml citam o período pelo `code` (`leiaute: '020'`). A vigência de uma versão de
# Guia ou de leiaute vai do início do seu período até o início do período seguinte entre as versões
# habilitadas do mesmo documento (corretivas do mesmo período dividem o intervalo; quem fecha o
# `knowledge` da anterior é a reconciliação, em `published_on`).
version: 1
series:
  efd-icms-ipi:
    title: Leiautes da EFD ICMS/IPI (Ato COTEPE/ICMS nº 44/2018 e alterações)
    source_url: https://www.confaz.fazenda.gov.br/legislacao/atos/2018/ato-cotepe-icms-44-18
    # O Ato institui a NT (com a tabela 3.1.1 de versões) e o Guia Prático de cada ano, pelo MD5.
    # Códigos e datas: tabela 3.1.1 da NT 2026.001 v1.0, conferida com a tabela externa 3.1.1 do
    # WS de Tabelas Externas (idTabela=11, versão 21, dtVersao 2026-08-27). Leiautes 002 a 012
    # (2009–2018) são do Ato COTEPE 09/2008, fora do Ato 44/2018 e do corpus.
    periods:
      - code: "013"
        from: 2019-01-01
        to: 2020-01-01
        act: Ato COTEPE/ICMS 57/18
        note: versão 112; NT 2018.001 e Guia 3.0.1
      - code: "014"
        from: 2020-01-01
        to: 2021-01-01
        act: Ato COTEPE/ICMS 65/19
        note: versão 113; NT 2019.001 v1.0 e Guia 3.0.3 (Ato 44/20, Guia 3.0.4, sem efeitos)
      - code: "015"
        from: 2021-01-01
        to: 2022-01-01
        act: Atos COTEPE/ICMS 59/20 e 70/20
        note: versão 114; NT 2020.001 v1.1 e Guia 3.0.6 (Guia 3.0.5 sem efeitos)
      - code: "016"
        from: 2022-01-01
        to: 2023-01-01
        act: Ato COTEPE/ICMS 87/21
        note: >-
          versão 115; NT 2021.001 v1.1 e Guia 3.0.8 (o CONFAZ anota "efeitos de 01.01.22 a
          31.12.23"; a tabela 3.1.1 fecha o leiaute em 31/12/2022). Guias 3.0.7, 3.0.9, 3.1.0 e
          3.1.1 sem efeitos
      - code: "017"
        from: 2023-01-01
        to: 2024-01-01
        act: Atos COTEPE/ICMS 117/22 e 21/23
        note: versão 116; NT 2022.001 v1.2; Guia 3.1.2 até 31/03/2023 e 3.1.3 a partir de 01/04/2023
      - code: "018"
        from: 2024-01-01
        to: 2025-01-01
        act: Ato COTEPE/ICMS 179/23
        note: versão 117; NT 2023.001 v1.2 e Guia 3.1.6 (Ato 134/23, v1.1 e Guia 3.1.5, sem efeitos)
      - code: "019"
        from: 2025-01-01
        to: 2026-01-01
        act: Atos COTEPE/ICMS 131/24 e 164/24
        note: >-
          versão 118; NT 2024.001 v1.0 e Guia 3.1.8 (3.1.7 sem efeitos). O corpus usa o Guia 3.1.9
          neste período, como a fixture da F2 (o 3.1.8 é mais antigo que o 3.1.9 já publicado no
          staging e, ingerido depois, inverteria o conhecimento de 2025)
      - code: "020"
        from: 2026-01-01
        to: 2027-01-01
        act: Atos COTEPE/ICMS 79/25, 150/25, 39/26 e 86/26
        note: >-
          versão 119; NT 2025.001 v1.0. Guia 3.2.1 de 01/01 a 22/03/2026, 3.2.2 a partir de
          23/03/2026 e 3.2.4 a partir de 10/09/2026; 3.1.9, 3.2.0 e 3.2.3 sem efeitos (no corpus,
          3.2.0 a 3.2.4 são corretivas deste período)
      - code: "021"
        from: 2027-01-01
        to: null
        act: Ato COTEPE/ICMS 69/26
        note: >-
          versão 120; NT 2026.001 v1.0 (Anexo I: "válido de 01/01/2027 a 31/12/2027"; a tabela
          externa deixa DT_FIM vazio, então o período fica em aberto até o próximo leiaute)

  efd-reinf:
    title: Leiautes da EFD-Reinf (Atos Declaratórios Executivos Cofis)
    source_url: https://www.gov.br/sped/pt-br/assuntos/escrituracoes-digitais/efd-reinf/documento-tecnicos/versao-atual/leiautes
    # Os ADE fixam a competência a partir da qual a versão é exigida. O texto dos ADE não sai do
    # portal de normas da RFB por HTTP simples (aplicação em JavaScript); as competências vêm das
    # notícias oficiais do SPED (http://sped.rfb.gov.br/pagina/show/6043 e .../7186). A versão 2.1
    # (ADE Cofis 93/2021, "a partir de janeiro de 2023") foi substituída pela 2.1.1 antes de
    # produzir efeito e não tem período. As revisões 2.1.2a, 2.1.2b e o XSD de CNPJ alfanumérico
    # seguem sob o ADE 23/2023 e não abrem período novo.
    periods:
      - code: 2.1.1
        from: 2023-03-01
        to: 2023-09-01
        act: Ato Declaratório Executivo Cofis nº 60, de 6 de julho de 2022
        note: exigida a partir da competência de março de 2023; termina com o início da 2.1.2
      - code: 2.1.2
        from: 2023-09-01
        to: null
        act: Ato Declaratório Executivo Cofis nº 23, de 10 de março de 2023
        note: exigida a partir da competência de setembro de 2023
