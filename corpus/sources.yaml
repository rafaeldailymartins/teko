# Fontes do corpus do Tekó, ondas C1 e C2 (plano, "Corpus por ondas").
# Schema e resolução das datas: apps/api/src/adapters/in/cli/ingest/sources.ts. Procedência,
# método de levantamento e o que ficou de fora: corpus/README.md.
#
# Cada documento tem metadados (slug, família, título, emissor, URL canônica), o parser
# (`go-html-state-machine`, `docling-guia`, `docling-generic`, `reinf-xsd`, `sped-tabelas`) e a
# validade da versão de documento:
#   - leiaute: período de corpus/leiaute-periods.yaml (código em `leiaute`), até o início do
#     período seguinte entre as versões habilitadas; corretivas do mesmo período dividem o intervalo;
#   - nt: o período do leiaute da NT; effective_from/mandatory_from padrão = início do período;
#   - publication: [published_on, próxima publicação) (Guia EFD-GO);
#   - consolidated (RCTE, CTE) e table (Tabelas GO): a versão vem do próprio conteúdo.
# Modos: `pinned` (arquivo imutável: sha256 obrigatório, conferido no discover), `live` (página
# que muda; o sha256 baixado identifica a versão) e `ws-tabela` (versão atual pelo
# consultarVersoesTabelasExternas). `page_ranges` divide o Docling em partes (páginas base 1,
# inclusivas); `timeout_seconds` é o document_timeout de cada parte. Fonte com `enabled: false`
# fica registrada, sem download, com o motivo em `disabled_reason`.
#
# URLs do gov.br: o PDF/zip só vem com o sufixo /@@download/file (a URL "limpa" devolve a página
# HTML do portal). Levantamento de 2026-11-11 (User-Agent teko-corpus-watch, ≤ 1 req/s).
