# Plano B do Tekó (Render Free): web e API, descrito como Blueprint. Fica PARADO: só é ativado pelo runbook
# docs/runbooks/vercel-paused.md (pausa de 30 dias do Hobby, conta Vercel encerrada ou mudança dos
# termos do Hobby) e no ensaio a cada release minor. Só a produção tem Plano B.
#
# - Mesmo entrypoint de sempre: apps/api/src/server.ts, empacotado pelo tsdown em
#   apps/api/dist/server.mjs, com RUNTIME_TARGET=render (BackgroundTasks só acompanha a promise;
#   trustProxy do valor medido no ensaio).
# - Web e API na mesma origem (ADR 0029): o mesmo serviço serve o export do Next (apps/web/out,
#   WEB_STATIC_DIR) com a política das rotas da Vercel (apps/api/src/adapters/in/http/static-site).
# - Sem rootDir: o build precisa de packages/shared e do pnpm-lock.yaml da raiz.
# - Auto-deploy desligado; deploy só por deploy hook com ?ref=<sha da tag do release>.
# - Nenhuma forma de pagamento no workspace: ao fim das horas ou da banda o Render suspende em vez
#   de cobrar.
# - Segredos (sync: false) são pedidos só na criação do Blueprint; depois, mudam no dashboard.
#
# Detalhes, corte e ensaio: infra/planb-render/README.md.
services:
  - type: web
    name: teko-api-planb
    runtime: node
    plan: free
    # O Render não tem região na América do Sul; Virginia é a mais próxima do Neon aws-sa-east-1.
    region: virginia
    branch: main
    autoDeployTrigger: "off"
    # --ignore-scripts: nenhum script de dependência roda (o `prepare` da raiz instala hooks do
    # lefthook, inútil aqui). NODE_ENV=production fica só no start: no build, o pnpm precisa das
    # devDependencies (tsdown).
    buildCommand: >-
      corepack pnpm install --frozen-lockfile --ignore-scripts --filter "@teko/api..." --filter "@teko/web..." &&
      corepack pnpm --filter @teko/api build && corepack pnpm --filter @teko/web build
    startCommand: NODE_ENV=production node apps/api/dist/server.mjs
    # Nunca toca o banco. O UptimeRobot passa a pingar este caminho a cada 5 min durante o corte.
    healthCheckPath: /healthz
    # Acima do SHUTDOWN_GRACE_MS (105 s), que já cobre um stream inteiro (teto de 100 s): a API sai
    # antes do SIGKILL. Se o plano free ignorar o campo, o Render mata o processo em 30 s (padrão)
    # e streams longos em curso são cortados.
    maxShutdownDelaySeconds: 110
    envVars:
      # --- Config (a mesma de infra/vercel/env.production.json, com RUNTIME_TARGET=render) -------
      - key: NODE_VERSION
        value: "24"
      - key: APP_ENV
        value: production
      - key: RUNTIME_TARGET
        value: render
      # A própria origem do serviço (web e API juntas); host real atribuído pelo Render.
      - key: WEB_ORIGIN
        value: https://teko-api-planb.onrender.com
      # Export do web servido pela API (relativo ao diretório de trabalho, a raiz do repositório).
      - key: WEB_STATIC_DIR
        value: apps/web/out
      - key: RERANKER_PROVIDER
        value: workers-ai
      - key: LOG_LEVEL
        value: info
      - key: EMBEDDINGS_PROVIDER
        value: workers-ai
      - key: GEMINI_MODEL_PRIMARY
        value: gemini-3.6-flash
      - key: GEMINI_MODEL_FALLBACK
        value: gemini-3.5-flash-lite
      - key: GROQ_MODEL
        value: openai/gpt-oss-120b
      - key: QUOTA_QUESTIONS_GLOBAL_DAILY
        value: "300"
      - key: QUOTA_QUESTIONS_PER_USER_DAILY
        value: "30"
      - key: QUOTA_NEURONS_DAILY
        value: "800"
      - key: QUOTA_STREAM_SECONDS_DAILY
        value: "6000"
      - key: LANGFUSE_BASE_URL
        value: https://cloud.langfuse.com
      # Medido no ensaio do Plano B (número de saltos ou IPs/CIDRs); a API não sobe sem ele.
      - key: TRUST_PROXY
        sync: false
      # --- Segredos: os mesmos de runtime do teko-api (nunca neste arquivo) ---------------------
      - key: DATABASE_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: CF_ACCOUNT_ID
        sync: false
      - key: CF_AI_TOKEN
        sync: false
      - key: BETTER_AUTH_SECRET
        sync: false
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: LANGFUSE_PUBLIC_KEY
        sync: false
      - key: LANGFUSE_SECRET_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: POSTHOG_PERSONAL_API_KEY
        sync: false
