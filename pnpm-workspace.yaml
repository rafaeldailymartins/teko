packages:
  - apps/*
  - packages/*

# Supply chain: cada configuração abaixo é deliberada (ver docs/adr/0002-supply-chain-pnpm.md).
catalogMode: strict
savePrefix: ""
minimumReleaseAge: 10080 # 7 dias, coerente com o cooldown do Dependabot
trustPolicy: no-downgrade
# Sem trustPolicyExclude no workspace da aplicação: a única exceção (chokidar@4.0.3, do steiger)
# saiu com o steiger (ADR 0032). Exceções novas são por versão exata e justificadas no ADR 0002.
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
pmOnFail: ignore
# Builds de dependências: allowlist revisada item a item. Nada roda sem aprovação explícita.
allowBuilds:
  # postinstall só instala hooks; o script `prepare` da raiz já faz isso explicitamente.
  lefthook: false
  # Só compilam do fonte quando falta o binário pré-compilado (que chega como optionalDependency).
  "@parcel/watcher": false
  "@swc/core": false
  # Testcontainers (só testes): ssh2 e cpu-features compilam aceleradores nativos opcionais (via dockerode;
  # o ssh2 tem fallback em JS) e o postinstall do protobufjs (via @grpc/grpc-js) só confere o CLI dele.
  cpu-features: false
  ssh2: false
  protobufjs: false
  esbuild: false

# Correções de vulnerabilidades transitivas (versões exatas, maduras). Revisar a cada atualização
# do pacote que as puxa; remover quando o upstream já trouxer a versão corrigida.
overrides:
  # GHSA-mrhx-c7xc-m3w5 (high). Via @vercel/functions > @vercel/oidc > @vercel/cli-config (zod 4.1.11).
  zod@<4.6.6: 4.6.7
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw (moderate).
  qs@<6.16.1: 6.17.1
  # GHSA-g3hv-75wg-m249 (moderate). Via @stryker-mutator/core (minimatch 10.2.6); cruza major.
  minimatch@>=7.0.0 <11.0.1: 11.0.4
  # GHSA de AbortSignal no glob >=9 <=14.0.1 (moderate). Só em devDependencies de teste e eval:
  # testcontainers > archiver > archiver-utils (glob ^10, usa `sync` em CommonJS, mantido no 14) e
  # promptfoo (usa glob/globSync, idem).
  archiver-utils>glob: 14.0.3
  promptfoo>glob: 14.0.3
  # Negação de serviço no parser de listagem do basic-ftp <=6.2.0 (high). Via promptfoo > proxy-agent >
  # pac-proxy-agent > get-uri (só eval; o Tekó não usa FTP nem PAC).
  get-uri>basic-ftp: 6.2.5
  # GHSA-jpvv-r467-5p4w e GHSA-qv5m-9pm6-hqp3 (moderate). Via promptfoo (fixa 2.1.5) e
  # @modelcontextprotocol/sdk; só eval, o Tekó não sobe o servidor MCP do promptfoo.
  "@hono/node-server@<2.1.6": 2.1.6
  # sharp é opcional do Next (otimização de imagens), sem uso no export estático (images.unoptimized).
  # Removido: traz binários libvips sob LGPL-3.0, fora da allowlist de licenças do dependency-review.
  next>sharp: "-"
  # Opcionais do promptfoo sem uso nas evals (o provider é próprio, in-process; geração vai por
  # Gemini/Groq, que o promptfoo chama por HTTP). Removidos porque trazem licenças fora da
  # allowlist: sharp (libvips LGPL-3.0), pdf-parse (@napi-rs/canvas, CC-BY-SA-3.0),
  # @aws/bedrock-token-generator (sem licença detectada) e @modelcontextprotocol/server-filesystem
  # (sem arquivo de licença no tarball).
  promptfoo>sharp: "-"
  promptfoo>pdf-parse: "-"
  promptfoo>@aws/bedrock-token-generator: "-"
  promptfoo>@modelcontextprotocol/server-filesystem: "-"
  # Uma cópia só da API do OpenTelemetry. O @netlify/blobs (F3) traz o @netlify/otel, cujos SDKs
  # pedem `@opentelemetry/api <1.10.0`; com duas cópias (1.9.1 e 1.10.0), o pnpm resolvia o vitest
  # com peers diferentes por pacote e o @fast-check/vitest do shared via outra instância ("failed
  # to find the current suite"). Rever quando o @netlify/otel aceitar a 1.10.
  "@opentelemetry/api": 1.9.1

catalog:
  # Ferramentas da raiz
  "@biomejs/biome": 2.6.4
  "@fission-ai/openspec": 1.16.0
  "@types/node": 24.19.2
  "@typescript/native": npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@6.0.2
  git-cliff: 2.14.2
  jscpd: 5.4.2
  knip: 6.44.1
  lefthook: 2.2.1 # 2.2.2 publicado sem proveniência SLSA (trustPolicy: no-downgrade); ver ADR 0002
  sherif: 1.13.0
  turbo: 2.11.10
  type-coverage: 2.31.1
  dependency-cruiser: 18.7.2
  tsdown: 0.23.5

  # Testes e qualidade
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  fast-check: 4.10.2
  "@fast-check/vitest": 0.5.0
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@stryker-mutator/typescript-checker": 10.1.1

  # Domínio compartilhado
  zod: 4.6.7

  # API
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  "@fastify/helmet": 13.2.0
  "@fastify/cors": 11.4.0
  "@fastify/rate-limit": 11.2.2
  "@fastify/under-pressure": 9.2.1
  "@fastify/sensible": 6.0.7
  "@fastify/swagger": 9.9.3
  "@scalar/fastify-api-reference": 1.76.4
  pino: 10.4.0
  pino-pretty: 13.2.0
  close-with-grace: 2.5.0
  "@vercel/functions": 3.7.6 # última com provenance SLSA + trusted publisher; 3.9+ sem provenance (ADR 0002)

  # Banco (F2). Nenhum driver Postgres do npm é publicado com proveniência: pg e Testcontainers são
  # exceções da regra de proveniência do repositório, documentadas no ADR 0002 (o trustPolicy
  # no-downgrade só recusa a perda de proveniência, não a ausência).
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  pg: 8.23.1
  "@types/pg": 8.23.1
  "@testcontainers/postgresql": 12.2.1
  promptfoo: 0.125.1
  yaml: 2.9.1 # já vinha na árvore (promptfoo e outros); golden.yaml e, na F3, corpus/sources.yaml no CLI

  # Ingestão (F3)
  htmlparser2: 12.0.0 # máquina de estados do RCTE/CTE e XSD da REINF (xmlMode)
  # Só até a etapa C2 da ADR 0030 (o adapter Netlify e a migração para o GitHub Releases saem).
  "@netlify/blobs": 11.1.7 # 11.1.8 e 11.1.9 ainda dentro da janela de 7 dias em 2026-11-11

  # Web
  next: 16.4.5
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  tailwindcss: 4.3.4
  "@tailwindcss/postcss": 4.3.4
  postcss: 8.5.32
  babel-plugin-react-compiler: 1.0.0
  next-intl: 4.14.9
