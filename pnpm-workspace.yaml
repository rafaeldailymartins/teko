packages:
  - apps/*
  - packages/*

# Supply chain: cada configuração abaixo é deliberada (ver docs/adr/0002-supply-chain-pnpm.md).
catalogMode: strict
savePrefix: ""
minimumReleaseAge: 10080 # 7 dias, coerente com o cooldown do Dependabot
trustPolicy: no-downgrade
# Sem trustPolicyExclude no workspace da aplicação: a única exceção (chokidar@4.0.3, do steiger)
# saiu com o steiger (ADR 0032). Exceções novas são por versão exata e justificadas no ADR 0002.
blockExoticSubdeps: true
strictDepBuilds: true
engineStrict: true
pmOnFail: ignore
# Builds de dependências: allowlist revisada item a item. Nada roda sem aprovação explícita.
allowBuilds:
  # postinstall só instala hooks; o script `prepare` da raiz já faz isso explicitamente.
  lefthook: false
  # Só compilam do fonte quando falta o binário pré-compilado (que chega como optionalDependency).
  "@parcel/watcher": false
  "@swc/core": false
  # Testcontainers (só testes): ssh2 e cpu-features compilam aceleradores nativos opcionais (via dockerode;
  # o ssh2 tem fallback em JS) e o postinstall do protobufjs (via @grpc/grpc-js) só confere o CLI dele.
  cpu-features: false
  ssh2: false
  protobufjs: false
  esbuild: false
  # Via posthog-js: o postinstall do core-js só imprime um pedido de doação.
  core-js: false

# Correções de vulnerabilidades transitivas (versões exatas, maduras). Revisar a cada atualização
# do pacote que as puxa; remover quando o upstream já trouxer a versão corrigida.
overrides:
  # GHSA-mrhx-c7xc-m3w5 (high). Via @vercel/functions > @vercel/oidc > @vercel/cli-config (zod 4.1.11).
  zod@<4.6.6: 4.6.7
  # GHSA-q8mj-m7cp-5q26, GHSA-x5fp-wj9c-mxmx, GHSA-4mjr-xmp4-gh2g, GHSA-6pq8-jhm2-2vcw (moderate).
  qs@<6.16.1: 6.17.1
  # GHSA-g3hv-75wg-m249 (moderate). Via @stryker-mutator/core (minimatch 10.2.6); cruza major.
  minimatch@>=7.0.0 <11.0.1: 11.0.4
  # GHSA de AbortSignal no glob >=9 <=14.0.1 (moderate). Só em devDependencies de teste e eval:
  # testcontainers > archiver > archiver-utils (glob ^10, usa `sync` em CommonJS, mantido no 14) e
  # promptfoo (usa glob/globSync, idem).
  archiver-utils>glob: 14.0.3
  promptfoo>glob: 14.0.3
  # GHSA-52cp-r559-cp3m, GHSA-5p4m-2wfm-xmqj e GHSA-2883-xcg3-v3hh (high, CPU quadrática). Via
  # @hey-api/openapi-ts > @hey-api/json-schema-ref-parser (js-yaml 4.2.0); só no codegen do web.
  "@hey-api/json-schema-ref-parser>js-yaml": 4.3.2
  # Negação de serviço no parser de listagem do basic-ftp <=6.2.0 (high). Via promptfoo > proxy-agent >
  # pac-proxy-agent > get-uri (só eval; o Tekó não usa FTP nem PAC).
  get-uri>basic-ftp: 6.2.5
  # GHSA-jpvv-r467-5p4w e GHSA-qv5m-9pm6-hqp3 (moderate). Via promptfoo (fixa 2.1.5) e
  # @modelcontextprotocol/sdk; só eval, o Tekó não sobe o servidor MCP do promptfoo.
  "@hono/node-server@<2.1.6": 2.1.6
  # sharp é opcional do Next (otimização de imagens), sem uso no export estático (images.unoptimized).
  # Removido: traz binários libvips sob LGPL-3.0, fora da allowlist de licenças do dependency-review.
  next>sharp: "-"
  # Opcionais do promptfoo sem uso nas evals (o provider é próprio, in-process; geração vai por
  # Gemini/Groq, que o promptfoo chama por HTTP). Removidos porque trazem licenças fora da
  # allowlist: sharp (libvips LGPL-3.0), pdf-parse (@napi-rs/canvas, CC-BY-SA-3.0),
  # @aws/bedrock-token-generator (sem licença detectada) e @modelcontextprotocol/server-filesystem
  # (sem arquivo de licença no tarball).
  promptfoo>sharp: "-"
  promptfoo>pdf-parse: "-"
  promptfoo>@aws/bedrock-token-generator: "-"
  promptfoo>@modelcontextprotocol/server-filesystem: "-"

# Advisories sem versão corrigida, conferidos como não exploráveis aqui. Cada um tem prazo de revisão
# no osv-scanner.toml da raiz e motivo no adendo de 2026-11-17 da ADR 0002; saem quando o upstream
# publicar a correção.
audit:
  ignore:
    # GHSA-fc5q-39xc-vjpf (high): ReDoS no picomatch <=4.0.7 com extglob repetido de um ramo só, sem
    # versão corrigida. Aqui o padrão é sempre do próprio código: next-intl > @parcel/watcher (vigia
    # de arquivos do extrator, só no build; o web é export estático), knip > tinyglobby e outros
    # globbers de desenvolvimento.
    - GHSA-fc5q-39xc-vjpf

catalog:
  # Ferramentas da raiz
  "@biomejs/biome": 2.6.4
  "@fission-ai/openspec": 1.16.0
  "@types/node": 24.19.2
  "@typescript/native": npm:typescript@7.0.2
  typescript: npm:@typescript/typescript6@6.0.2
  git-cliff: 2.14.2
  jscpd: 5.4.2
  knip: 6.44.1
  lefthook: 2.2.1 # 2.2.2 publicado sem proveniência SLSA (trustPolicy: no-downgrade); ver ADR 0002
  sherif: 1.13.0
  turbo: 2.11.10
  type-coverage: 2.31.1
  dependency-cruiser: 18.7.2
  tsdown: 0.23.5

  # Testes e qualidade
  vitest: 5.1.0
  "@vitest/coverage-v8": 5.1.0
  fast-check: 4.10.2
  "@fast-check/vitest": 0.5.0
  "@stryker-mutator/core": 10.1.1
  "@stryker-mutator/vitest-runner": 10.1.1
  "@stryker-mutator/typescript-checker": 10.1.1

  # Domínio compartilhado
  zod: 4.6.7

  # API
  fastify: 5.12.8
  fastify-type-provider-zod: 7.0.0
  "@fastify/helmet": 13.2.0
  "@fastify/rate-limit": 11.2.2
  "@fastify/under-pressure": 9.2.1
  "@fastify/sensible": 6.0.7
  "@fastify/swagger": 9.9.3
  "@scalar/fastify-api-reference": 1.76.4
  pino: 10.4.0
  pino-pretty: 13.2.0
  close-with-grace: 2.5.0
  # Better Auth (F4): núcleo, adapter do Drizzle (entry /relations-v2) e passkey, sempre na mesma linha.
  better-auth: 1.7.18
  "@better-auth/drizzle-adapter": 1.7.18
  "@better-auth/passkey": 1.7.18
  # AI SDK da Vercel (F4): cadeia de LLM (Gemini e Groq) e o schema do UI Message Stream. Núcleo e
  # provedores sempre na mesma base (@ai-sdk/provider e provider-utils iguais); todos com proveniência.
  # Substitui @google/genai (sem proveniência) e groq-sdk, por decisão do mantenedor em 2026-11-14.
  ai: 7.0.164
  "@ai-sdk/google": 4.0.113
  "@ai-sdk/groq": 4.0.77
  "@vercel/functions": 3.7.6 # última com provenance SLSA + trusted publisher; 3.9+ sem provenance (ADR 0002)

  # Telemetria (F6, add-otel-telemetry): OTel linha 2.x (estável 2.12.x, experimental 0.223.x) e o
  # plugin do Fastify da mesma linha. A linha 3 (e o @fastify/otel 1.x, que já a exige) espera o
  # Langfuse suportar OTel 3 (ignore de major no Dependabot). Todos com proveniência. A api fica na
  # 1.10.0, a mesma que a árvore já tinha (Next, promptfoo): uma 1.9.x só na API duplicaria as
  # variantes de peer do vitest e quebraria o @fast-check/vitest. O SDK 2.12 declara `< 1.10` (aviso
  # de peer, como o do promptfoo antes); a API é compatível dentro da major 1 (ADR 0002, adendo).
  "@opentelemetry/api": 1.10.0
  "@opentelemetry/api-logs": 0.223.1
  "@opentelemetry/sdk-trace-node": 2.12.1
  "@opentelemetry/sdk-metrics": 2.12.1
  "@opentelemetry/sdk-logs": 0.223.1
  "@opentelemetry/resources": 2.12.1
  "@opentelemetry/semantic-conventions": 1.45.0
  "@opentelemetry/exporter-trace-otlp-http": 0.223.1
  "@opentelemetry/exporter-metrics-otlp-http": 0.223.1
  "@opentelemetry/exporter-logs-otlp-http": 0.223.1
  "@fastify/otel": 0.21.4
  # Erros da API no PostHog Error Tracking (F6, add-error-tracking, ADR 0037): MIT, com proveniência
  # SLSA; 5.68+ tinha menos de 7 dias.
  posthog-node: 5.67.0

  # Langfuse (F6, add-llm-tracing-langfuse): o processor entra no mesmo provider do OTel 2.x (peers
  # @opentelemetry/core e sdk-trace-base ^2, exporter OTLP < 0.300) e cria as observations do
  # trace answer-question. MIT, com proveniência. O @langfuse/client fica de fora: depende do
  # mustache 4.2.0, sem proveniência; score, annotation queue e apagamento vão pela API pública.
  "@langfuse/otel": 6.1.1
  "@langfuse/tracing": 6.1.1

  # Banco (F2). Nenhum driver Postgres do npm é publicado com proveniência: pg e Testcontainers são
  # exceções da regra de proveniência do repositório, documentadas no ADR 0002 (o trustPolicy
  # no-downgrade só recusa a perda de proveniência, não a ausência).
  drizzle-orm: 1.0.0-rc.5
  drizzle-kit: 1.0.0-rc.5
  pg: 8.23.1
  "@types/pg": 8.23.1
  "@testcontainers/postgresql": 12.2.1
  promptfoo: 0.125.1
  yaml: 2.9.1 # já vinha na árvore (promptfoo e outros); golden.yaml e, na F3, corpus/sources.yaml no CLI

  # Ingestão (F3)
  htmlparser2: 12.0.0 # máquina de estados do RCTE/CTE e XSD da REINF (xmlMode)

  # Web
  next: 16.4.5
  react: 19.3.1
  react-dom: 19.3.1
  "@types/react": 19.3.0
  "@types/react-dom": 19.3.0
  tailwindcss: 4.3.4
  "@tailwindcss/postcss": 4.3.4
  postcss: 8.5.32
  babel-plugin-react-compiler: 1.0.0
  next-intl: 4.14.9
  # Design system (F5): shadcn sobre Base UI, componentes copiados para apps/web/src/components/ui.
  "@base-ui/react": 1.9.0 # primitivos acessíveis sem estilo (dialog, menu, drawer, tooltip...)
  class-variance-authority: 0.7.1 # variantes dos componentes do shadcn (sem proveniência publicada)
  clsx: 2.1.1 # junção condicional de classes no `cn` (sem proveniência publicada)
  tailwind-merge: 3.7.0 # resolve conflitos de utilitários do Tailwind no `cn`
  lucide-react: 1.70.0 # ícones SVG importados um a um
  tw-animate-css: 1.4.0 # animações de entrada e saída dos popups (CSS puro)
  cmdk: 1.1.1 # paleta de comandos (Ctrl/⌘+K) do command do shadcn; sem proveniência publicada
  react-resizable-panels: 4.19.1 # painéis do app shell (window splitter por teclado); sem proveniência publicada
  happy-dom: 21.0.4 # DOM dos testes de componentes com interação (só nos arquivos que pedem)
  "@playwright/test": 1.65.0 # e2e na stack de CI (Chromium + viewport mobile); browsers baixados no job
  "@axe-core/playwright": 4.14.0 # axe nas jornadas e2e (WCAG 2.2 AA, gate de acessibilidade da F5); MPL-2.0
  "@tanstack/react-query": 5.107.1 # cache de dados do web (F5): hooks sobre o cliente gerado do OpenAPI
  nuqs: 2.10.2 # estado em query string no export estático (q, c, ref); 2.10.3 tinha menos de 7 dias
  "@hey-api/openapi-ts": 0.99.0 # CLI que gera o cliente fetch, o SDK e as queries do OpenAPI da API
  # Chat (F5): useChat sobre o transporte próprio (mesma linha do `ai`: 4.0.168 depende do ai 7.0.164).
  "@ai-sdk/react": 4.0.168
  streamdown: 2.7.1 # markdown em streaming das respostas (carregado sob demanda só no chat)
  "@streamdown/code": 2.0.0 # blocos de código do Streamdown (Shiki)
  rehype-harden: 1.1.9 # links só para a própria origem e fontes oficiais; sem imagens nem data:
  "@simplewebauthn/browser": 13.3.0 # cerimônia WebAuthn da passkey no web (a mesma do plugin do Better Auth), carregada sob demanda
  # Analytics de produto (F6): só por import() depois do consentimento, no adapter de src/lib/analytics.
  # Apache-2.0 AND MIT, com proveniência SLSA; 1.448+ tinha menos de 7 dias.
  posthog-js: 1.447.3
